services:
  - type: web
    name: feira-cultural-ti
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2
    envVars:
      - key: SYSTEM_ACTIVE
        value: "true"
      - key: GOOGLE_API_KEY
        sync: false
      - key: PORT
        value: "10000"
