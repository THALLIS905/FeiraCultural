<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BYTE 3D · Feira Cultural TI</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Fontes Inter & Apple System -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Favicon / Ícone da aba -->
    <link rel="icon" href="Byte.jfif" type="image/jpeg">
    <link rel="shortcut icon" href="Byte.jfif" type="image/jpeg">
    <!-- Three.js (r128) & OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Inter", sans-serif;
            background-color: #020617;
            /* Preto/Azul Profundo - Igual ao creditos.html */
            color: #ffffff;
            user-select: none;
            -webkit-user-select: none;
            height: 100vh;
            height: 100dvh;
            width: 100vw;
            position: relative;
        }

        /* ── Fundo Vivo em Azul (Ambient Glowing Living Mesh) ── */
        .ambient-mesh {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
            background: radial-gradient(circle at 50% 15%, #051433 0%, #020b1e 50%, #01040a 100%);
        }

        /* Grelha sutil de fundo em azul/cinza */
        .cyber-grid {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(to right, rgba(56, 189, 248, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(56, 189, 248, 0.05) 1px, transparent 1px);
            background-size: 38px 38px;
            opacity: 0.65;
        }

        /* Orbes orgânicos pulsantes em azul vivo */
        .glow-orb {
            position: absolute;
            border-radius: 9999px;
            filter: blur(85px);
            opacity: 0.70;
            will-change: transform, opacity;
        }

        .orb-1 {
            top: -12%;
            left: 15%;
            width: 580px;
            height: 580px;
            background: radial-gradient(circle, #0284c7 0%, #1e40af 55%, transparent 75%);
            animation: floatOrb1 14s ease-in-out infinite alternate;
        }

        .orb-2 {
            bottom: -15%;
            right: 5%;
            width: 620px;
            height: 620px;
            background: radial-gradient(circle, #2563eb 0%, #0369a1 50%, transparent 75%);
            animation: floatOrb2 16s ease-in-out infinite alternate;
        }

        .orb-3 {
            top: 40%;
            left: -10%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, #0ea5e9 0%, #1d4ed8 45%, transparent 75%);
            animation: floatOrb3 18s ease-in-out infinite alternate;
        }

        .orb-4 {
            top: 25%;
            right: 20%;
            width: 440px;
            height: 440px;
            background: radial-gradient(circle, #38bdf8 0%, #1e3a8a 60%, transparent 80%);
            opacity: 0.45;
            animation: pulseGlow 8s ease-in-out infinite alternate;
        }

        @keyframes floatOrb1 {
            0% {
                transform: translate(0, 0) scale(1);
            }

            50% {
                transform: translate(70px, 50px) scale(1.12);
            }

            100% {
                transform: translate(-40px, 80px) scale(0.95);
            }
        }

        @keyframes floatOrb2 {
            0% {
                transform: translate(0, 0) scale(1);
            }

            50% {
                transform: translate(-80px, -60px) scale(1.15);
            }

            100% {
                transform: translate(40px, -40px) scale(0.92);
            }
        }

        @keyframes floatOrb3 {
            0% {
                transform: translate(0, 0) scale(1);
            }

            50% {
                transform: translate(50px, -50px) scale(1.08);
            }

            100% {
                transform: translate(-30px, 40px) scale(0.90);
            }
        }

        @keyframes pulseGlow {
            0% {
                opacity: 0.35;
                transform: scale(0.95);
            }

            100% {
                opacity: 0.65;
                transform: scale(1.15);
            }
        }

        /* ── Canvas 3D ── */
        #canvas-container {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            cursor: grab;
            z-index: 1;
        }

        #canvas-container:active {
            cursor: grabbing;
        }

        /* ── Efeito Apple Frosted Glass / Liquid Glassmorphism Escuro ── */
        .apple-glass {
            background: rgba(11, 20, 38, 0.72);
            -webkit-backdrop-filter: blur(36px) saturate(210%);
            backdrop-filter: blur(36px) saturate(210%);
            border: 1px solid rgba(56, 189, 248, 0.28);
            box-shadow:
                0 25px 60px -15px rgba(0, 0, 0, 0.85),
                0 0 35px -5px rgba(2, 132, 199, 0.20),
                0 1px 0 0 rgba(255, 255, 255, 0.15) inset;
        }

        .apple-glass-card {
            background: rgba(15, 23, 42, 0.65);
            -webkit-backdrop-filter: blur(24px) saturate(190%);
            backdrop-filter: blur(24px) saturate(190%);
            border: 1px solid rgba(148, 163, 184, 0.18);
            box-shadow:
                0 10px 25px -4px rgba(0, 0, 0, 0.45),
                0 1px 0 0 rgba(255, 255, 255, 0.08) inset;
            transition: all 0.28s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* ── Header Capsule (Estilo Apple Pill) ── */
        #header-capsule {
            position: fixed;
            top: calc(env(safe-area-inset-top, 16px) + 12px);
            left: 50%;
            transform: translateX(-50%);
            z-index: 40;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 20px;
            border-radius: 999px;
            white-space: nowrap;
            pointer-events: auto;
        }

        /* ── Barra / Dock Inferior com Botões de Texto ── */
        #dock-container {
            position: fixed;
            bottom: calc(env(safe-area-inset-bottom, 16px) + 12px);
            left: 50%;
            transform: translateX(-50%);
            z-index: 30;
            width: 100%;
            max-width: 720px;
            padding: 0 14px;
            display: flex;
            justify-content: center;
            pointer-events: none;
        }

        #dock-wrapper {
            pointer-events: auto;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 8px;
            border-radius: 999px;
            overflow-x: auto;
            max-width: 100%;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
            white-space: nowrap;
        }

        #dock-wrapper::-webkit-scrollbar {
            display: none;
        }

        /* ── Botão de Navegação Baseado Exclusivamente em Texto ── */
        .dock-btn {
            flex-shrink: 0;
            padding: 9px 18px;
            border-radius: 999px;
            font-size: 0.80rem;
            font-weight: 600;
            color: #cbd5e1;
            cursor: pointer;
            border: 1px solid rgba(148, 163, 184, 0.22);
            background: rgba(15, 23, 42, 0.65);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            letter-spacing: -0.01em;
            text-align: center;
        }

        .dock-btn:hover {
            background: rgba(18, 34, 68, 0.85);
            color: #ffffff;
            border-color: rgba(56, 189, 248, 0.5);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px -2px rgba(2, 132, 199, 0.35);
        }

        .dock-btn:active {
            transform: scale(0.97);
        }

        .dock-btn.btn-active {
            background: #0284c7;
            color: #ffffff;
            border-color: #38bdf8;
            box-shadow:
                0 0 0 2px rgba(56, 189, 248, 0.35),
                0 8px 24px -2px rgba(2, 132, 199, 0.50);
        }

        /* ── Backdrop do Modal (Mobile / Desktop) ── */
        #modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(2, 6, 23, 0.60);
            -webkit-backdrop-filter: blur(8px);
            backdrop-filter: blur(8px);
            z-index: 45;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        #modal-backdrop.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* ── Painel / Pop de Texto com Efeito Vidro Apple ── */
        #detail-modal {
            position: fixed;
            z-index: 50;
            max-height: calc(88vh - env(safe-area-inset-bottom, 20px));
            max-height: calc(88dvh - env(safe-area-inset-bottom, 20px));
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            border-radius: 32px;
            padding: 24px 24px 22px;
            box-shadow:
                0 30px 70px -15px rgba(0, 0, 0, 0.90),
                0 0 30px -5px rgba(2, 132, 199, 0.25),
                0 1px 0 0 rgba(255, 255, 255, 0.15) inset;
            opacity: 0;
            pointer-events: none;
            transition: transform 0.38s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.35s ease;
        }

        #detail-modal::-webkit-scrollbar {
            width: 5px;
        }

        #detail-modal::-webkit-scrollbar-thumb {
            background: rgba(56, 189, 248, 0.30);
            border-radius: 99px;
        }

        /* Desktop: Painel Flutuante à Direita */
        @media (min-width: 769px) {
            #detail-modal {
                top: 50%;
                right: 36px;
                transform: translateY(-50%) translateX(40px) scale(0.96);
                width: 420px;
            }

            #detail-modal.active {
                opacity: 1;
                pointer-events: auto;
                transform: translateY(-50%) translateX(0) scale(1.0);
            }
        }

        /* Mobile: Apple Bottom Sheet Fluído */
        @media (max-width: 768px) {
            #detail-modal {
                left: 12px;
                right: 12px;
                bottom: calc(env(safe-area-inset-bottom, 12px) + 8px);
                width: calc(100% - 24px);
                max-width: 460px;
                margin: 0 auto;
                border-radius: 28px;
                transform: translateY(110%);
                padding: 20px 18px 20px;
            }

            #detail-modal.active {
                opacity: 1;
                pointer-events: auto;
                transform: translateY(0);
            }

            .dock-btn {
                padding: 8px 14px;
                font-size: 0.74rem;
            }
        }

        /* ── Ponto Informativo (Lista Minimalista de Texto) ── */
        .info-point {
            background: rgba(15, 23, 42, 0.68);
            -webkit-backdrop-filter: blur(20px);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(148, 163, 184, 0.18);
            border-radius: 18px;
            padding: 13px 15px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            transition: all 0.2s ease;
        }

        .info-point:hover {
            background: rgba(18, 32, 64, 0.85);
            border-color: rgba(56, 189, 248, 0.45);
            transform: translateX(2px);
        }

        .point-number {
            font-size: 0.72rem;
            font-weight: 800;
            color: #38bdf8;
            background: rgba(56, 189, 248, 0.15);
            border-radius: 8px;
            padding: 2px 7px;
            letter-spacing: 0.04em;
            flex-shrink: 0;
            margin-top: 1px;
            line-height: 1.4;
        }

        .project-card-link {
            display: block;
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid rgba(56, 189, 248, 0.25);
            border-radius: 14px;
            padding: 9px 12px;
            text-decoration: none;
            transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .project-card-link:hover {
            background: rgba(2, 132, 199, 0.22);
            border-color: #38bdf8;
            transform: translateY(-1.5px);
            box-shadow: 0 6px 18px -2px rgba(2, 132, 199, 0.30);
        }

        .point-text {
            font-size: 0.84rem;
            line-height: 1.55;
            color: #e2e8f0;
            margin: 0;
            font-weight: 450;
        }

        /* Sub-pills de navegação rápida (apenas texto) */
        .nav-text-pill {
            background: rgba(15, 23, 42, 0.65);
            border: 1px solid rgba(56, 189, 248, 0.25);
            border-radius: 999px;
            padding: 6px 14px;
            font-size: 0.74rem;
            font-weight: 600;
            color: #94a3b8;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .nav-text-pill:hover {
            background: rgba(56, 189, 248, 0.20);
            border-color: #38bdf8;
            color: #ffffff;
            transform: scale(1.03);
        }

        /* ── Emojis e Frases Flutuantes ao Redor do Robô ── */
        .robot-floating-bubble {
            position: absolute;
            background: rgba(11, 20, 38, 0.88);
            -webkit-backdrop-filter: blur(24px) saturate(200%);
            backdrop-filter: blur(24px) saturate(200%);
            border: 1px solid rgba(56, 189, 248, 0.45);
            box-shadow:
                0 14px 35px -5px rgba(2, 6, 23, 0.75),
                0 0 20px -2px rgba(56, 189, 248, 0.35),
                0 1px 0 0 rgba(255, 255, 255, 0.20) inset;
            border-radius: 9999px;
            padding: 8px 16px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.80rem;
            font-weight: 600;
            color: #ffffff;
            pointer-events: none;
            user-select: none;
            white-space: nowrap;
            animation: bubblePopFloat 3.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            z-index: 50;
            will-change: transform, opacity;
        }

        .robot-floating-bubble .bubble-emoji {
            font-size: 1.15rem;
            line-height: 1;
            filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.4));
        }

        .robot-floating-bubble .bubble-text {
            color: #f8fafc;
            letter-spacing: -0.01em;
        }

        @keyframes bubblePopFloat {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.65) translateY(20px);
            }

            15% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.08) translateY(-4px);
            }

            25% {
                transform: translate(-50%, -50%) scale(1.0) translateY(-8px);
            }

            75% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.0) translateY(-26px);
            }

            100% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.85) translateY(-48px);
            }
        }
    </style>
</head>

<body>

    <!-- Fundo Vivo em Azul e Preto (Mesmo do creditos.html) -->
    <div class="ambient-mesh">
        <div class="cyber-grid"></div>
        <div class="glow-orb orb-1"></div>
        <div class="glow-orb orb-2"></div>
        <div class="glow-orb orb-3"></div>
        <div class="glow-orb orb-4"></div>
    </div>

    <!-- Canvas 3D Three.js -->
    <div id="canvas-container"></div>

    <!-- Contêiner de Emojis e Frases Flutuantes ao Redor do Robô -->
    <div id="robot-bubbles-container" class="pointer-events-none fixed inset-0 overflow-hidden" style="z-index: 50;">
    </div>

    <!-- Overlay de Escurecimento Progressivo por Rotação de Gesto (0° a 90°) -->
    <div id="gesture-dimmer"
        style="position:fixed; inset:0; background:#000000; opacity:0; pointer-events:none; z-index:9998; transition:opacity 0.12s cubic-bezier(0.16, 1, 0.3, 1);">
    </div>

    <!-- Áudio de Fundo de Transição (Crescendo Reverse) para Rotação da Mão -->
    <audio id="transition-bg-audio" preload="auto">
        <source src="Efeito Sonoro de Transição - [Crescendo Reverse 1].mp3" type="audio/mpeg">
    </audio>

    <!-- Indicador Flutuante Discreto de Rotação (Apple Glass Style) -->
    <div id="rotation-hud" class="apple-glass"
        style="position:fixed; top:75px; left:50%; transform:translateX(-50%); z-index:9999; padding:6px 16px; border-radius:999px; font-size:0.75rem; font-weight:600; color:#ffffff; display:none; align-items:center; gap:8px;">
        <span class="text-slate-400 font-medium">Rotacao:</span>
        <span id="rotation-angle-val" class="font-bold text-sky-400">0°</span>
        <div style="width:64px; height:4px; background:rgba(255,255,255,0.12); border-radius:99px; overflow:hidden;">
            <div id="rotation-progress-bar"
                style="width:0%; height:100%; background:#38bdf8; transition:width 0.1s ease-out;"></div>
        </div>
    </div>

    <!-- Header Capsule (Apple Pill Minimalista e Limpo) -->
    <header id="header-capsule" class="apple-glass">
        <span class="text-xs font-bold tracking-wider text-white uppercase">BYTE 3D</span>
        <span class="text-xs text-slate-500">·</span>
        <span id="capsule-status" class="text-xs font-medium text-slate-300">Feira Cultural de TI</span>

        <!-- Botão Mudo/Ouvir Baseado Exclusivamente em Texto -->
        <button id="btn-toggle-sound"
            class="ml-1 px-3 py-1 rounded-full text-[11px] font-semibold bg-sky-950/80 hover:bg-sky-900 border border-sky-400/35 text-sky-300 transition">
            Voz Ativa
        </button>
    </header>

    <!-- Backdrop para fechar o pop ao clicar fora -->
    <div id="modal-backdrop"></div>

    <!-- Pop de Texto com Efeito Vidro Apple (Apple Sheet / Float Modal) -->
    <div id="detail-modal" class="apple-glass">
        <!-- Handle decorativo para Mobile (estilo iOS Sheet) -->
        <div class="w-10 h-1 bg-slate-600/80 rounded-full mx-auto mb-3.5 md:hidden"></div>

        <!-- Topo do Modal: Título e Botão Fechar em Texto -->
        <div class="flex items-start justify-between gap-3 mb-4">
            <div>
                <h2 id="modal-title"
                    class="text-base md:text-lg font-extrabold text-white tracking-tight leading-tight">
                    Desenvolvimento de Software
                </h2>
                <p id="modal-subtitle" class="text-xs font-medium text-slate-400 mt-0.5">
                    Feira Cultural de TI
                </p>
            </div>

            <!-- Botão Fechar em Texto Limpo -->
            <button id="btn-close-modal"
                class="px-3.5 py-1.5 rounded-full text-xs font-semibold text-slate-300 bg-slate-800/80 hover:bg-slate-700 hover:text-white border border-slate-700 transition shrink-0">
                Fechar
            </button>
        </div>

        <!-- Lista de Pontos Informativos (Texto Limpo e Moderno) -->
        <div id="modal-content-list" class="space-y-2.5 mb-4">
            <!-- Injetado dinamicamente via JS -->
        </div>

        <!-- Navegação Rápida entre Temas (Texto Limpo) -->
        <div class="pt-3 border-t border-slate-800/80">
            <div class="text-[10px] font-bold text-sky-400 uppercase tracking-wider mb-2">Outros Temas</div>
            <div id="modal-sub-nav" class="flex flex-wrap gap-1.5">
                <!-- Injetado dinamicamente via JS -->
            </div>
        </div>
    </div>

    <!-- Dock Inferior com Botões de Texto Simples (Design Minimalista) -->
    <nav id="dock-container">
        <div id="dock-wrapper" class="apple-glass">
            <!-- Botões gerados dinamicamente via JS -->
        </div>
    </nav>

    <script>
        /* ================================================================

                    'Conversar com educação, ouvir opiniões diferentes e não participar de ataques ou brincadeiras que humilham ajudam a manter a internet mais saudável para todo mundo.'
                ],
                speechText: 'Na internet existem pessoas de verdade do outro lado da tela. Respeito, empatia e checagem de informações mantêm a rede mais saudável para todo mundo!'

        /* ================================================================
           2. SISTEMA DE VOZ NATIVO (Web Speech API) - SEM ÍCONES
        ================================================================ */
        let activeTopicId = null;
        let soundEnabled = true;
        const synth = window.speechSynthesis;
        let ttsVoice = null;

        function initTTSVoice() {
            if (!synth) return;
            const voices = synth.getVoices() || [];
            ttsVoice = voices.find(v => v.lang === 'pt-BR' && (v.name.includes('Google') || v.name.includes('Luciana') || v.localService))
                || voices.find(v => v.lang === 'pt-BR')
                || voices.find(v => v.lang.startsWith('pt'))
                || voices[0] || null;
        }

        if (synth) {
            initTTSVoice();
            if (synth.onvoiceschanged !== undefined) {
                synth.onvoiceschanged = initTTSVoice;
            }
        }

        function speakText(text, onFinished) {
            if (!synth || !soundEnabled) {
                if (onFinished) onFinished();
                return;
            }
            stopSpeaking();

            const clean = text
                .replace(/[^\u0000-\u007E\u00C0-\u017E\u00C0-\u02AF\u1E00-\u1EFF\u0100-\u024F\s\d.,!?;:'"()\-–—]/g, '')
                .replace(/\n+/g, ' ').trim();

            const utter = new SpeechSynthesisUtterance(clean);
            utter.lang = 'pt-BR';
            utter.rate = 1.05;
            utter.pitch = 1.0;
            if (ttsVoice) utter.voice = ttsVoice;

            const capsuleStatus = document.getElementById('capsule-status');

            utter.onstart = () => {
                setRobotMode('talking');
                capsuleStatus.textContent = 'BYTE explicando...';
            };

            utter.onend = utter.onerror = () => {
                capsuleStatus.textContent = activeTopicId ? 'Explorando tema' : 'Feira Cultural de TI';
                setRobotMode('idle');
                if (onFinished) onFinished();
            };

            synth.speak(utter);
        }

        function stopSpeaking() {
            if (synth) {
                try { synth.cancel(); } catch (e) { }
            }
            setRobotMode('idle');
        }

        /* ================================================================
           3. GESTÃO DOS BOTÕES DE TEXTO E CARDS INFORMATIVOS

        // Renderização dos botões de texto simples na Dock
        function renderDockButtons() {
            dockWrapper.innerHTML = '';
            TOPICS.forEach(topic => {
                const btn = document.createElement('button');
                btn.className = 'dock-btn';
                btn.dataset.topicId = topic.id;
                btn.textContent = topic.buttonLabel;
                btn.addEventListener('click', () => selectTopic(topic.id));
                dockWrapper.appendChild(btn);
            });
        }

        // Selecionar tema e exibir card com os 4 pontos
        function selectTopic(id) {
            const topic = TOPICS.find(t => t.id === id);
            if (!topic) return;

            activeTopicId = id;
            stopSpeaking();

            // Atualiza destaque no botão da Dock
            document.querySelectorAll('.dock-btn').forEach(btn => {
                btn.classList.toggle('btn-active', btn.dataset.topicId === id);

            }

            contentList.innerHTML = contentHtml;

            // Atalhos de texto limpo para os outros temas
            const navContainer = document.getElementById('modal-sub-nav');

            navContainer.innerHTML = otherTopics.map(other => `
                <button class="nav-text-pill" data-target="${other.id}">
                    ${other.buttonLabel}

            // Eventos dos atalhos
            navContainer.querySelectorAll('[data-target]').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    selectTopic(btn.dataset.target);
                });

            // Abre o Card com Efeito de Vidro

            detailModal.classList.add('active');

            // Robô reage com animação e fala o resumo do tema

        // Fechar o Card Informativo
        function closeModal() {
            stopSpeaking();

        // Alternar áudio (botão de texto)

        /* ================================================================

        let scene, camera, renderer, controls;

        const state = {

        };
        const clock = new THREE.Clock();

        /* ================================================================

        const ROBOT_PHRASES = {

        const bubblesContainer = document.getElementById('robot-bubbles-container');
        let lastBubbleTime = 0;

        function spawnRobotBubble(category = 'idle') {
            if (!bubblesContainer) return;
            const now = Date.now();
            if (now - lastBubbleTime < 1800) return; // Evita empilhamento
            lastBubbleTime = now;

            const pool = ROBOT_PHRASES[category] || ROBOT_PHRASES.idle;
            const item = pool[Math.floor(Math.random() * pool.length)];

            // Posições ao redor do robô (em torno do centro da tela) - balões ACIMA do robô
            const isMobile = window.innerWidth < 768;
            const positions = [
                { x: isMobile ? -55 : -170, y: isMobile ? -185 : -165 }, // Superior Esquerdo
                { x: isMobile ? 55 : 170, y: isMobile ? -185 : -165 },   // Superior Direito
                { x: isMobile ? -80 : -210, y: isMobile ? -130 : -100 }, // Lateral Esquerda Alta
                { x: isMobile ? 80 : 210, y: isMobile ? -130 : -100 },   // Lateral Direita Alta
                { x: 0, y: isMobile ? -220 : -205 }                      // Topo Central
            ];
            const pos = positions[Math.floor(Math.random() * positions.length)];

            const bubble = document.createElement('div');
            bubble.className = 'robot-floating-bubble';
            bubble.style.left = `calc(50% + ${pos.x}px)`;
            bubble.style.top = `calc(50% + ${pos.y}px)`;

            bubble.innerHTML = `
                <span class="bubble-emoji">${item.emoji}</span>
                <span class="bubble-text">${item.text}</span>
            `;

            bubblesContainer.appendChild(bubble);

            setTimeout(() => {
                if (bubble.parentNode) {
                    bubble.parentNode.removeChild(bubble);
                }
            }, 3600);
        }

        function setRobotMode(mode) {
            state.mode = mode;
            if (mode !== 'idle') {
                state.idleAction = 'none';
                state.idleActionTime = 0;
                spawnRobotBubble(mode);
            } else {
                state.idleTimer = 1.5 + Math.random() * 2.0;
            }
        }

        const IDLE_ACTION_LIST = ['wave', 'lookAround', 'happyBounce', 'headTilt', 'wiggle'];
        let lastIdleActionIndex = -1;

        function triggerIdleAction(action) {
            state.idleAction = action;
            state.idleActionTime = 0;
            if (action === 'wave') state.idleActionDuration = 3.2;
            else if (action === 'lookAround') state.idleActionDuration = 4.0;
            else if (action === 'happyBounce') state.idleActionDuration = 2.4;
            else if (action === 'headTilt') state.idleActionDuration = 3.0;
            else if (action === 'wiggle') state.idleActionDuration = 2.8;
            else state.idleActionDuration = 2.5;

            // Spawna balão dinâmico da ação correspondente
            spawnRobotBubble(action);
        }

        function pickNextIdleAction() {
            let nextIdx = Math.floor(Math.random() * IDLE_ACTION_LIST.length);
            if (nextIdx === lastIdleActionIndex) {
                nextIdx = (nextIdx + 1) % IDLE_ACTION_LIST.length;
            }
            lastIdleActionIndex = nextIdx;
            return IDLE_ACTION_LIST[nextIdx];
        }

        window.onload = function () {
            initThreeJS();

        function initThreeJS() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();

            camera = new THREE.PerspectiveCamera(36, window.innerWidth / window.innerHeight, 0.1, 100);
            const isMobile = window.innerWidth < 768;
            camera.position.set(0, isMobile ? 1.55 : 1.35, isMobile ? 7.2 : 6.2);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.outputEncoding = THREE.sRGBEncoding;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.08;
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.target.set(0, 1.15, 0);
            controls.enableDamping = true;
            controls.dampingFactor = 0.06;
            controls.enablePan = false;
            controls.minDistance = 3.5;
            controls.maxDistance = 10.0;
            controls.maxPolarAngle = Math.PI / 2 + 0.08;
            controls.minPolarAngle = 0.25;
            controls.update();

            const hemiLight = new THREE.HemisphereLight(0xffffff, 0x020b1e, 0.95);
            hemiLight.position.set(0, 10, 0);

            const mainLight = new THREE.DirectionalLight(0xffffff, 0.95);
            mainLight.position.set(3.5, 6.5, 4.5);

            rimLight.position.set(0, 4, -5);

        function createSoftShadowTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 256;
            const ctx = canvas.getContext('2d');
            const g = ctx.createRadialGradient(128, 128, 10, 128, 128, 124);
            g.addColorStop(0, 'rgba(0, 0, 0, 0.65)');
            g.addColorStop(0.5, 'rgba(2, 6, 23, 0.20)');
            g.addColorStop(1, 'rgba(0, 0, 0, 0.0)');
            ctx.fillStyle = g;
            ctx.fillRect(0, 0, 256, 256);
            return new THREE.CanvasTexture(canvas);
        }

        function createCrescentEyeGeometry() {
            const shape = new THREE.Shape();
            shape.moveTo(-0.17, -0.03);
            shape.bezierCurveTo(-0.17, 0.09, -0.08, 0.13, 0, 0.13);
            shape.bezierCurveTo(0.08, 0.13, 0.17, 0.09, 0.17, -0.03);
            shape.bezierCurveTo(0.17, -0.07, 0.12, -0.08, 0.08, -0.05);
            shape.bezierCurveTo(0.03, -0.02, -0.03, -0.02, -0.08, -0.05);
            shape.bezierCurveTo(-0.12, -0.08, -0.17, -0.07, -0.17, -0.03);
            const extrudeSettings = { depth: 0.015, bevelEnabled: true, bevelSegments: 3, steps: 1, bevelSize: 0.008, bevelThickness: 0.008 };
            const geom = new THREE.ExtrudeGeometry(shape, extrudeSettings);
            geom.center();
            return geom;
        }

        function buildRobot() {

            const glossyVisorMat = new THREE.MeshPhysicalMaterial({ color: 0x06090e, roughness: 0.08, metalness: 0.1, clearcoat: 1.0, clearcoatRoughness: 0.06, reflectivity: 0.95 });
            cyanEyeMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8 });

            // Pedestal
            const baseGroup = new THREE.Group();
            scene.add(baseGroup);
            const pedestalMesh = new THREE.Mesh(new THREE.CylinderGeometry(1.18, 1.24, 0.11, 64), pedestalMat);
            pedestalMesh.position.y = 0.055;

            baseGroup.add(pedestalMesh);

            const ringMesh = new THREE.Mesh(new THREE.TorusGeometry(1.17, 0.012, 16, 64), new THREE.MeshBasicMaterial({ color: 0x38bdf8 }));
            ringMesh.rotation.x = Math.PI / 2;
            ringMesh.position.y = 0.11;
            baseGroup.add(ringMesh);

            const floorShadowMat = new THREE.MeshBasicMaterial({ map: createSoftShadowTexture(), transparent: true, depthWrite: false });
            const floorShadow = new THREE.Mesh(new THREE.PlaneGeometry(3.2, 3.2), floorShadowMat);
            floorShadow.rotation.x = -Math.PI / 2;
            floorShadow.position.y = 0.002;
            baseGroup.add(floorShadow);

            baseShadowMesh = new THREE.Mesh(new THREE.PlaneGeometry(1.35, 1.35), floorShadowMat);
            baseShadowMesh.rotation.x = -Math.PI / 2;
            baseShadowMesh.position.y = 0.113;
            baseGroup.add(baseShadowMesh);

            // Robô Flutuante
            robotRoot = new THREE.Group();
            robotRoot.position.y = 0.24;
            scene.add(robotRoot);

            torsoGroup = new THREE.Group();
            robotRoot.add(torsoGroup);

            const bodyGeo = new THREE.SphereGeometry(0.64, 48, 48);
            bodyGeo.scale(0.96, 1.28, 0.90);
            const bodyMesh = new THREE.Mesh(bodyGeo, whitePlasticMat);
            bodyMesh.position.y = 0.78;
            bodyMesh.castShadow = bodyMesh.receiveShadow = true;
            torsoGroup.add(bodyMesh);

            const collarMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.36, 0.48, 0.14, 32), indigoAccentMat);
            collarMesh.position.set(0, 1.44, 0.02);
            collarMesh.scale.set(1.05, 1, 0.92);
            torsoGroup.add(collarMesh);

            const bibMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.115, 0.105, 0.34, 24), indigoAccentMat);
            bibMesh.position.set(0, 1.25, 0.51);
            bibMesh.rotation.x = -0.22;
            bibMesh.scale.set(1, 1, 0.45);
            torsoGroup.add(bibMesh);

            const bibTipMesh = new THREE.Mesh(new THREE.SphereGeometry(0.105, 24, 24), indigoAccentMat);
            bibTipMesh.position.set(0, 1.09, 0.545);
            bibTipMesh.scale.set(1, 0.9, 0.45);
            torsoGroup.add(bibTipMesh);

            [-1, 1].forEach(side => {
                const socketMesh = new THREE.Mesh(new THREE.SphereGeometry(0.22, 24, 24), lightGrayMat);
                socketMesh.position.set(side * 0.54, 1.14, 0);
                socketMesh.scale.set(0.5, 1.1, 0.95);
                torsoGroup.add(socketMesh);
            });

            const neckMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.28, 0.18, 32), darkJointMat);
            neckMesh.position.y = 1.54;
            torsoGroup.add(neckMesh);

            // Braços
            function createArm(isLeft) {
                const side = isLeft ? -1 : 1;
                const pivot = new THREE.Group();
                pivot.position.set(side * 0.65, 1.18, 0);
                const jointMesh = new THREE.Mesh(new THREE.SphereGeometry(0.135, 24, 24), darkJointMat);
                pivot.add(jointMesh);
                const armBody = new THREE.Group();
                armBody.position.set(side * 0.11, -0.34, 0.02);
                armBody.rotation.z = side * -0.14;
                pivot.add(armBody);
                const armGeo = new THREE.SphereGeometry(0.15, 32, 32);
                armGeo.scale(0.82, 2.55, 0.95);
                const armMesh = new THREE.Mesh(armGeo, whitePlasticMat);
                armMesh.castShadow = true;
                armBody.add(armMesh);
                const innerGeo = new THREE.SphereGeometry(0.135, 24, 24);
                innerGeo.scale(0.65, 2.25, 0.78);
                const innerMesh = new THREE.Mesh(innerGeo, lightGrayMat);
                innerMesh.position.set(-side * 0.045, -0.02, 0);
                armBody.add(innerMesh);
                return pivot;
            }
            leftArmPivot = createArm(true);
            rightArmPivot = createArm(false);
            torsoGroup.add(leftArmPivot);
            torsoGroup.add(rightArmPivot);

            // Cabeça
            headGroup = new THREE.Group();
            headGroup.position.set(0, 1.62, 0);
            torsoGroup.add(headGroup);

            const headGeo = new THREE.SphereGeometry(0.74, 48, 48);
            headGeo.scale(1.08, 0.92, 0.96);
            const headMesh = new THREE.Mesh(headGeo, whitePlasticMat);
            headMesh.position.y = 0.56;
            headMesh.castShadow = headMesh.receiveShadow = true;
            headGroup.add(headMesh);

            const topCapGeo = new THREE.SphereGeometry(0.36, 32, 24, 0, Math.PI * 2, 0, Math.PI * 0.36);
            topCapGeo.scale(1.15, 0.45, 0.95);
            const topCapMesh = new THREE.Mesh(topCapGeo, indigoAccentMat);
            topCapMesh.position.set(0, 1.09, -0.02);
            headGroup.add(topCapMesh);

            [-1, 1].forEach(side => {
                const earGroup = new THREE.Group();
                earGroup.position.set(side * 0.78, 0.54, 0);
                const earInnerGeo = new THREE.CylinderGeometry(0.17, 0.19, 0.08, 24);
                earInnerGeo.rotateZ(Math.PI / 2);
                earGroup.add(new THREE.Mesh(earInnerGeo, darkJointMat));
                const earOuterGeo = new THREE.SphereGeometry(0.18, 24, 24);
                earOuterGeo.scale(0.45, 1.05, 0.95);
                const earOuterMesh = new THREE.Mesh(earOuterGeo, whitePlasticMat);
                earOuterMesh.position.x = side * 0.045;
                earOuterMesh.castShadow = true;
                earGroup.add(earOuterMesh);
                headGroup.add(earGroup);
            });

            // Visor e Olhos
            visorGroup = new THREE.Group();
            visorGroup.position.set(0, 0.54, 0.05);
            headGroup.add(visorGroup);

            const visorGeo = new THREE.SphereGeometry(0.58, 48, 48);
            visorGeo.scale(1.06, 0.84, 0.92);
            const visorMesh = new THREE.Mesh(visorGeo, glossyVisorMat);
            visorMesh.position.z = 0.14;
            visorGroup.add(visorMesh);

            const eyeGeo = createCrescentEyeGeometry();
            leftEyeMesh = new THREE.Mesh(eyeGeo, cyanEyeMat);
            leftEyeMesh.position.set(-0.21, 0.04, 0.655);
            leftEyeMesh.rotation.y = -0.26;
            leftEyeMesh.rotation.z = 0.08;
            visorGroup.add(leftEyeMesh);

            rightEyeMesh = new THREE.Mesh(eyeGeo, cyanEyeMat);
            rightEyeMesh.position.set(0.21, 0.04, 0.655);
            rightEyeMesh.rotation.y = 0.26;
            rightEyeMesh.rotation.z = -0.08;
            visorGroup.add(rightEyeMesh);
        }

        function setupEvents() {
            const container = document.getElementById('canvas-container');

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                const isMobile = window.innerWidth < 768;
                camera.position.z = isMobile ? 7.2 : 6.2;
                camera.position.y = isMobile ? 1.55 : 1.35;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            window.addEventListener('mousemove', (e) => {
                state.mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                state.mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            });

            window.addEventListener('touchmove', (e) => {
                if (e.touches.length > 0) {
                    state.mouse.x = (e.touches[0].clientX / window.innerWidth) * 2 - 1;
                    state.mouse.y = -(e.touches[0].clientY / window.innerHeight) * 2 + 1;
                }
            }, { passive: true });

            // Reação tátil: tocar/clicar no robô ocioso dispara um aceno ou pulo alegre instantâneo
            if (container) {
                container.addEventListener('click', () => {
                    if (state.mode === 'idle') {
                        const touchReactions = ['wave', 'happyBounce', 'headTilt'];
                        const picked = touchReactions[Math.floor(Math.random() * touchReactions.length)];
                        triggerIdleAction(picked);
                    }
                });

                // Mobile touch - detecta tap (sem movimento significativo) para garantir reação em celulares
                let _touchStartX = 0, _touchStartY = 0, _touchStartTime = 0;
                container.addEventListener('touchstart', (e) => {
                    if (e.touches.length === 1) {
                        _touchStartX = e.touches[0].clientX;
                        _touchStartY = e.touches[0].clientY;
                        _touchStartTime = Date.now();
                    }
                }, { passive: true });

                container.addEventListener('touchend', (e) => {
                    if (e.changedTouches.length === 1) {
                        const dx = e.changedTouches[0].clientX - _touchStartX;
                        const dy = e.changedTouches[0].clientY - _touchStartY;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        const duration = Date.now() - _touchStartTime;
                        // Apenas dispara se for um tap rápido (pouco movimento, curta duração)
                        if (dist < 18 && duration < 450 && state.mode === 'idle') {
                            const touchReactions = ['wave', 'happyBounce', 'headTilt', 'wiggle', 'lookAround'];
                            const picked = touchReactions[Math.floor(Math.random() * touchReactions.length)];
                            triggerIdleAction(picked);
                        }
                    }
                }, { passive: true });
            }
        }

        /* ── Loop de Animação Super Expressivo ── */
        function animate() {
            requestAnimationFrame(animate);
            const delta = Math.min(clock.getDelta(), 0.1);
            const elapsed = clock.getElapsedTime();

            // Flutuação base contínua com suavidade
            const floatOffset = Math.sin(elapsed * 2.2) * 0.045;
            let extraBounce = 0;

            // Pulso sutil de energia e brilho nos olhos
            if (cyanEyeMat) {
                const eyePulse = 0.5 + Math.sin(elapsed * 3.2) * 0.5;
                cyanEyeMat.color.setRGB(
                    0.38 + eyePulse * 0.05,
                    0.40 + eyePulse * 0.45,
                    0.96 + eyePulse * 0.04
                );
            }

            // Gerenciador de Piscadas Orgânicas (Simples e Duplas)
            state.blinkTimer -= delta;
            if (state.blinkTimer <= 0 && !state.isBlinking) {
                state.isBlinking = true;
                state.blinkProgress = 0;
                state.isDoubleBlink = Math.random() < 0.35;
                state.doubleBlinkPhase = 0;
            }

            let leftEyeScaleY = 1.0;
            let rightEyeScaleY = 1.0;
            let eyeScaleX = 1.0;

            if (state.isBlinking) {
                state.blinkProgress += delta * 12;
                if (state.blinkProgress >= Math.PI) {
                    if (state.isDoubleBlink && state.doubleBlinkPhase === 0) {
                        state.doubleBlinkPhase = 1;
                        state.blinkProgress = 0;
                    } else {
                        state.isBlinking = false;
                        state.blinkTimer = 2.0 + Math.random() * 3.5;
                        leftEyeScaleY = 1.0;
                        rightEyeScaleY = 1.0;
                    }
                } else {
                    const blinkVal = Math.max(0.08, Math.cos(state.blinkProgress));
                    leftEyeScaleY = blinkVal;
                    rightEyeScaleY = blinkVal;
                }
            }

            // Targets de rotação para amortecimento lerp
            let targetHeadRotZ = 0, targetHeadRotX = 0, targetHeadRotY = 0;
            let targetRightArmZ = 0.16, targetRightArmX = 0;
            let targetLeftArmZ = -0.16, targetLeftArmX = 0;
            let targetTorsoRotZ = 0, targetTorsoRotY = 0;

            // ── MÁQUINA DE ESTADOS E ANIMAÇÕES ──
            if (state.mode === 'talking') {
                // Modo Fala: gesticulação contínua com cadência de voz
                const sc = Math.sin(elapsed * 7.5);
                targetHeadRotX = sc * 0.07;
                targetHeadRotZ = Math.sin(elapsed * 3.5) * 0.05;
                targetTorsoRotZ = Math.sin(elapsed * 3.0) * 0.03;
                targetRightArmZ = 0.42 + Math.sin(elapsed * 4.5) * 0.22;
                targetRightArmX = -0.18 + sc * 0.12;
                targetLeftArmZ = -0.42 - Math.cos(elapsed * 4.5) * 0.22;
                targetLeftArmX = -0.18 - sc * 0.12;
                leftEyeScaleY = 0.88 + Math.abs(sc) * 0.22;
                rightEyeScaleY = leftEyeScaleY;
                eyeScaleX = 1.0 + Math.sin(elapsed * 4) * 0.08;

            } else if (state.mode === 'thinking') {
                // Modo Pensativo: cabeça inclinada e mão perto do peito
                targetHeadRotZ = 0.24;
                targetHeadRotY = 0.16;
                targetTorsoRotZ = 0.05;
                targetRightArmZ = 0.22;
                targetLeftArmZ = -0.32;
                targetLeftArmX = -0.35;
                leftEyeMesh.scale.set(1.15, 1.15, 1);
                rightEyeMesh.scale.set(0.92, 0.88, 1);

            } else {
                // MODO IDLE: Animações Periódicas Frequentes
                if (state.idleAction === 'none') {
                    state.idleTimer -= delta;
                    if (state.idleTimer <= 0) {
                        triggerIdleAction(pickNextIdleAction());
                    }

                    // Quando parado (idle), solta frases e emojis periodicamente
                    state.idleBubbleTimer = (state.idleBubbleTimer === undefined ? 3.2 : state.idleBubbleTimer) - delta;
                    if (state.idleBubbleTimer <= 0) {
                        spawnRobotBubble('idle');
                        state.idleBubbleTimer = 4.2 + Math.random() * 2.8;
                    }

                    const breath = Math.sin(elapsed * 2.0);
                    const armBreath = Math.sin(elapsed * 2.2 - 0.4) * 0.07;
                    targetHeadRotZ = Math.sin(elapsed * 1.3) * 0.04;
                    targetHeadRotX = Math.sin(elapsed * 1.8) * 0.03;
                    targetRightArmZ = 0.16 + armBreath;
                    targetLeftArmZ = -0.16 - armBreath;
                    targetTorsoRotZ = breath * 0.025;

                } else {
                    state.idleActionTime += delta;
                    const p = Math.min(state.idleActionTime / state.idleActionDuration, 1.0);

                    if (state.idleAction === 'wave') {
                        // 1. ACENO / TCHAUZINHO AMIGÁVEL
                        if (p < 0.22) {
                            const t = p / 0.22;
                            targetRightArmZ = THREE.MathUtils.lerp(0.16, 2.15, t);
                            targetRightArmX = THREE.MathUtils.lerp(0, -0.28, t);
                            targetHeadRotZ = -0.14 * t;
                        } else if (p < 0.78) {
                            const waveSin = Math.sin((state.idleActionTime - 0.7) * 14);
                            targetRightArmZ = 2.15 + waveSin * 0.38;
                            targetRightArmX = -0.32 + waveSin * 0.14;
                            targetHeadRotZ = -0.16 + waveSin * 0.05;
                            targetHeadRotX = 0.05;
                            leftEyeScaleY = 0.82;
                            rightEyeScaleY = 0.82;
                            eyeScaleX = 1.14;
                        } else {
                            const t = (p - 0.78) / 0.22;
                            targetRightArmZ = THREE.MathUtils.lerp(2.15, 0.16, t);
                            targetRightArmX = THREE.MathUtils.lerp(-0.32, 0, t);
                            targetHeadRotZ = THREE.MathUtils.lerp(-0.16, 0, t);
                        }
                        targetLeftArmZ = -0.20;

                    } else if (state.idleAction === 'lookAround') {
                        // 2. OLHAR CURIOSO AO REDOR
                        if (p < 0.40) {
                            const t = Math.sin((p / 0.40) * Math.PI * 0.5);
                            targetHeadRotY = -0.48 * t;
                            targetHeadRotX = -0.06 * t;
                            targetHeadRotZ = -0.08 * t;
                            targetTorsoRotY = -0.12 * t;
                            leftEyeScaleY = 1.15;
                            rightEyeScaleY = 1.15;
                        } else if (p < 0.55) {
                            const t = (p - 0.40) / 0.15;
                            targetHeadRotY = THREE.MathUtils.lerp(-0.48, 0.48, t);
                            targetHeadRotX = 0;
                            targetHeadRotZ = THREE.MathUtils.lerp(-0.08, 0.14, t);
                            targetTorsoRotY = THREE.MathUtils.lerp(-0.12, 0.12, t);
                        } else if (p < 0.85) {
                            targetHeadRotY = 0.48;
                            targetHeadRotZ = 0.14;
                            targetHeadRotX = 0.06;
                            targetTorsoRotY = 0.12;
                            eyeScaleX = 1.08;
                        } else {
                            const t = (p - 0.85) / 0.15;
                            targetHeadRotY = THREE.MathUtils.lerp(0.48, 0, t);
                            targetHeadRotZ = THREE.MathUtils.lerp(0.14, 0, t);
                            targetTorsoRotY = THREE.MathUtils.lerp(0.12, 0, t);
                        }
                        targetRightArmZ = 0.18 + Math.sin(state.idleActionTime * 2.5) * 0.06;
                        targetLeftArmZ = -0.18 - Math.sin(state.idleActionTime * 2.5) * 0.06;

                    } else if (state.idleAction === 'happyBounce') {
                        // 3. SALTINHO DE ALEGRIA
                        const bounceSin = Math.sin(p * Math.PI * 4);
                        extraBounce = Math.max(0, bounceSin) * 0.12;
                        targetHeadRotX = -bounceSin * 0.14;
                        targetRightArmZ = 0.48 + bounceSin * 0.24;
                        targetLeftArmZ = -0.48 - bounceSin * 0.24;
                        targetRightArmX = 0.24;
                        targetLeftArmX = 0.24;
                        targetTorsoRotZ = Math.sin(p * Math.PI * 4) * 0.04;
                        leftEyeScaleY = 0.84 + Math.abs(bounceSin) * 0.28;
                        rightEyeScaleY = leftEyeScaleY;
                        eyeScaleX = 1.12;

                    } else if (state.idleAction === 'headTilt') {
                        // 4. INCLINAÇÃO CURIOSE & PISCADELA
                        const envelope = Math.sin(p * Math.PI);
                        targetHeadRotZ = 0.32 * envelope;
                        targetHeadRotY = 0.16 * envelope;
                        targetHeadRotX = -0.06 * envelope;
                        targetLeftArmZ = -0.32 * envelope;
                        targetLeftArmX = -0.34 * envelope;
                        targetRightArmZ = 0.18;
                        if (p > 0.32 && p < 0.68) {
                            rightEyeScaleY = 0.10;
                            leftEyeScaleY = 1.18;
                        }

                    } else if (state.idleAction === 'wiggle') {
                        // 5. GINGADO SIMPÁTICO
                        const envelope = Math.sin(p * Math.PI);
                        const rhythm = Math.sin(state.idleActionTime * 8);
                        targetTorsoRotZ = rhythm * 0.08 * envelope;
                        targetTorsoRotY = -rhythm * 0.05 * envelope;
                        targetHeadRotZ = -rhythm * 0.10 * envelope;
                        targetRightArmZ = 0.22 + rhythm * 0.20 * envelope;
                        targetLeftArmZ = -0.22 + rhythm * 0.20 * envelope;
                        leftEyeScaleY = 0.90 + Math.abs(rhythm) * 0.18;
                        rightEyeScaleY = leftEyeScaleY;
                    }

                    if (state.idleActionTime >= state.idleActionDuration) {
                        state.idleAction = 'none';
                        state.idleTimer = 2.5 + Math.random() * 3.5;
                    }
                }
            }

            if (state.mode !== 'thinking') {
                leftEyeMesh.scale.set(eyeScaleX, leftEyeScaleY, 1);
                rightEyeMesh.scale.set(eyeScaleX, rightEyeScaleY, 1);
            }

            // Rastreamento suave do cursor do mouse / toque
            state.currentLook.x += (state.mouse.x - state.currentLook.x) * 0.07;
            state.currentLook.y += (state.mouse.y - state.currentLook.y) * 0.07;

            const finalHeadRotY = state.currentLook.x * 0.36 + targetHeadRotY;
            const finalHeadRotX = -state.currentLook.y * 0.22 + targetHeadRotX;

            headGroup.rotation.y += (finalHeadRotY - headGroup.rotation.y) * 0.12;
            headGroup.rotation.x += (finalHeadRotX - headGroup.rotation.x) * 0.12;
            headGroup.rotation.z += (targetHeadRotZ - headGroup.rotation.z) * 0.12;

            leftEyeMesh.position.x = -0.21 + state.currentLook.x * 0.035;
            leftEyeMesh.position.y = 0.04 + state.currentLook.y * 0.025;
            rightEyeMesh.position.x = 0.21 + state.currentLook.x * 0.035;
            rightEyeMesh.position.y = 0.04 + state.currentLook.y * 0.025;

            rightArmPivot.rotation.z += (targetRightArmZ - rightArmPivot.rotation.z) * 0.14;
            rightArmPivot.rotation.x += (targetRightArmX - rightArmPivot.rotation.x) * 0.14;
            leftArmPivot.rotation.z += (targetLeftArmZ - leftArmPivot.rotation.z) * 0.14;
            leftArmPivot.rotation.x += (targetLeftArmX - leftArmPivot.rotation.x) * 0.14;

            torsoGroup.rotation.z += (targetTorsoRotZ - torsoGroup.rotation.z) * 0.10;
            const finalTorsoRotY = state.currentLook.x * 0.08 + targetTorsoRotY;
            torsoGroup.rotation.y += (finalTorsoRotY - torsoGroup.rotation.y) * 0.10;

            robotRoot.position.y = 0.24 + floatOffset + extraBounce;
            const shadowScale = 1.0 - (floatOffset + extraBounce) * 0.85;
            baseShadowMesh.scale.set(shadowScale, shadowScale, 1);

            controls.update();
            renderer.render(scene, camera);
        }

        /* ================================================================
           5. INTEGRAÇÃO WEBSOCKET EM TEMPO REAL COM GESTO DE ROTAÇÃO
        ================================================================ */
        const dimmerEl = document.getElementById('gesture-dimmer');
        const rotationHud = document.getElementById('rotation-hud');
        const rotationAngleVal = document.getElementById('rotation-angle-val');
        const rotationProgressBar = document.getElementById('rotation-progress-bar');
        const transitionBgAudio = document.getElementById('transition-bg-audio');

        // Desbloqueia reprodução de mídia em navegadores após a primeira interação do usuário
        const unlockBrowserAudio = () => {
            if (transitionBgAudio && transitionBgAudio.paused) {
                transitionBgAudio.load();
            }
            window.removeEventListener('pointerdown', unlockBrowserAudio);
            window.removeEventListener('keydown', unlockBrowserAudio);
        };
        window.addEventListener('pointerdown', unlockBrowserAudio, { once: true });
        window.addEventListener('keydown', unlockBrowserAudio, { once: true });

        let ws = null;
        function connectGestureWebSocket() {
            try {
                ws = new WebSocket('ws://127.0.0.1:8765');

                ws.onopen = () => {
                    console.log('[BYTE WS] Conectado ao servidor de visao computacional Python!');
                };

                ws.onmessage = (event) => {
                    try {
                        const data = JSON.parse(event.data);
                        if (data.type === 'rotation') {
                            const progress = Math.min(Math.max(data.progress || 0, 0), 1);
                            const angle = Math.round(data.angle || 0);

                            // Aplica escurecimento progressivo de 0% até 92% (90°)
                            if (dimmerEl) {
                                dimmerEl.style.opacity = (progress * 0.92).toString();
                            }

                            // Reproduz áudio de transição no navegador caso não esteja ativo nativamente no Python
                            if (transitionBgAudio && !data.sound_handled_by_backend) {
                                if (progress > 0.04) {
                                    if (transitionBgAudio.paused) {
                                        transitionBgAudio.play().catch(() => { });
                                    }
                                    transitionBgAudio.volume = Math.min(1.0, Math.max(0.2, progress));
                                } else {
                                    if (!transitionBgAudio.paused) {
                                        transitionBgAudio.pause();
                                        transitionBgAudio.currentTime = 0;
                                    }
                                }
                            }

                            // Feedback visual discreto de rotação
                            if (rotationHud) {
                                if (progress > 0.03) {
                                    rotationHud.style.display = 'flex';
                                    rotationAngleVal.textContent = `${angle}°`;
                                    rotationProgressBar.style.width = `${Math.round(progress * 100)}%`;
                                } else {
                                    rotationHud.style.display = 'none';
                                }
                            }
                        } else if (data.type === 'navigate' || data.type === 'transition_credits') {
                            // Transição cinematográfica aos 90°
                            if (dimmerEl) dimmerEl.style.opacity = '1.0';
                            if (transitionBgAudio && !data.sound_handled_by_backend) {
                                transitionBgAudio.volume = 1.0;
                            }
                            setTimeout(() => {
                                window.location.href = data.url || 'creditos.html';
                            }, 250);
                        }
                    } catch (e) {
                        console.error('[BYTE WS] Erro ao interpretar mensagem:', e);
                    }
                };

                ws.onclose = () => {
                    if (dimmerEl) dimmerEl.style.opacity = '0';
                    if (rotationHud) rotationHud.style.display = 'none';
                    if (transitionBgAudio && !transitionBgAudio.paused) {
                        transitionBgAudio.pause();
                        transitionBgAudio.currentTime = 0;
                    }
                    setTimeout(connectGestureWebSocket, 2000);
                };

                ws.onerror = () => {
                    if (ws) ws.close();
                };
            } catch (err) {
                setTimeout(connectGestureWebSocket, 2500);
            }
        }

        window.addEventListener('load', () => {
            connectGestureWebSocket();
        });
    </script>
