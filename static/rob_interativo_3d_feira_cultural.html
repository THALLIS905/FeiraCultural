<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robô Interativo 3D - Feira Cultural</title>
    <!-- Carregamento do Tailwind CSS para estilização minimalista da interface -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Fonte Inter para estética limpa e profissional -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Three.js (r128) e OrbitControls via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            /* Fundo minimalista branco gelo / cinza claro suave */
            background: radial-gradient(circle at 50% 45%, #f8fafc 0%, #e2e8f0 100%);
            user-select: none;
            -webkit-user-select: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
            cursor: grab;
        }
        #canvas-container:active {
            cursor: grabbing;
        }
        /* Efeito glassmorphism sutil para os botões */
        .glass-pill {
            background: rgba(255, 255, 255, 0.72);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 8px 32px rgba(15, 23, 42, 0.06);
        }
        .btn-action {
            transition: all 0.25s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .btn-action:hover {
            background: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(59, 130, 166, 0.18);
            color: #0284c7;
        }
        .btn-action:active {
            transform: translateY(0px) scale(0.97);
        }
        .btn-action.active-state {
            background: #3b82a6;
            color: #ffffff;
            box-shadow: 0 4px 14px rgba(59, 130, 166, 0.35);
        }
    </style>
</head>
<body>

    <!-- Container principal do WebGL / Three.js -->
    <div id="canvas-container"></div>

    <!-- Dica sutil de interação no topo (minimalista) -->
    <div class="fixed top-6 left-0 right-0 flex justify-center pointer-events-none z-10 px-4">
        <div class="glass-pill px-4 py-1.5 rounded-full text-xs font-medium text-slate-500 tracking-wide flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-cyan-500 animate-pulse"></span>
            Arraste para girar • Mova o cursor para interagir
        </div>
    </div>

    <!-- Controles flutuantes minimalistas na parte inferior -->
    <div class="fixed bottom-8 left-0 right-0 flex justify-center z-10 px-4">
        <div class="glass-pill p-1.5 rounded-full flex items-center gap-1.5 sm:gap-2">
            <button id="btn-wave" onclick="triggerAction('wave')" class="btn-action px-4 sm:px-5 py-2.5 rounded-full text-sm font-medium text-slate-700 flex items-center gap-2 cursor-pointer">
                <span>👋</span>
                <span>Acenar</span>
            </button>
            <button id="btn-happy" onclick="triggerAction('happy')" class="btn-action px-4 sm:px-5 py-2.5 rounded-full text-sm font-medium text-slate-700 flex items-center gap-2 cursor-pointer">
                <span>😊</span>
                <span>Feliz</span>
            </button>
            <button id="btn-curious" onclick="triggerAction('curious')" class="btn-action px-4 sm:px-5 py-2.5 rounded-full text-sm font-medium text-slate-700 flex items-center gap-2 cursor-pointer">
                <span>🤔</span>
                <span>Curioso</span>
            </button>
        </div>
    </div>

    <script>
        /**
         * Aplicação 3D Interativa - Robô Minimalista (Estilo Eilik / Feira Cultural)
         * Construído com Three.js utilizando primitivas geométricas suaves, materiais PBR
         * e sistema de animação procedural + rastreamento de cursor.
         */

        let scene, camera, renderer, controls;
        let robotRoot, torsoGroup, headGroup, leftArmPivot, rightArmPivot;
        let leftEyeMesh, rightEyeMesh, visorGroup;
        let baseShadowMesh;

        // Estado de animação e interação
        const state = {
            mouse: new THREE.Vector2(0, 0),
            targetLook: new THREE.Vector2(0, 0),
            currentLook: new THREE.Vector2(0, 0),
            action: 'idle', // 'idle', 'wave', 'happy', 'curious'
            actionTimer: 0,
            actionDuration: 0,
            blinkTimer: 2.5,
            isBlinking: false,
            blinkProgress: 0
        };

        const clock = new THREE.Clock();

        // Inicialização após carregamento completo da janela
        window.onload = function() {
            initThreeJS();
            buildRobot();
            setupEvents();
            animate();
        };

        function initThreeJS() {
            const container = document.getElementById('canvas-container');

            // 1. Cena
            scene = new THREE.Scene();

            // 2. Câmera
            camera = new THREE.PerspectiveCamera(
                36,
                window.innerWidth / window.innerHeight,
                0.1,
                100
            );
            camera.position.set(0, 1.35, 6.2);

            // 3. Renderizador com antialiasing e sombras suaves
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.outputEncoding = THREE.sRGBEncoding;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.08;
            container.appendChild(renderer.domElement);

            // 4. Controles de Órbita (Permite rotacionar e dar zoom suavemente)
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.target.set(0, 1.15, 0);
            controls.enableDamping = true;
            controls.dampingFactor = 0.06;
            controls.enablePan = false;
            controls.minDistance = 3.5;
            controls.maxDistance = 9.5;
            controls.maxPolarAngle = Math.PI / 2 + 0.08; // Impede passar por baixo do pedestal
            controls.minPolarAngle = 0.25;
            controls.update();

            // 5. Iluminação de Estúdio (Soft Lighting + Reflexos no visor)
            const hemiLight = new THREE.HemisphereLight(0xffffff, 0xcbd5e1, 0.85);
            hemiLight.position.set(0, 10, 0);
            scene.add(hemiLight);

            // Luz principal (Key Light) gerando sombras suaves
            const mainLight = new THREE.DirectionalLight(0xffffff, 0.85);
            mainLight.position.set(3.5, 6.5, 4.5);
            mainLight.castShadow = true;
            mainLight.shadow.mapSize.width = 1024;
            mainLight.shadow.mapSize.height = 1024;
            mainLight.shadow.camera.near = 1;
            mainLight.shadow.camera.far = 15;
            const d = 3;
            mainLight.shadow.camera.left = -d;
            mainLight.shadow.camera.right = d;
            mainLight.shadow.camera.top = d;
            mainLight.shadow.camera.bottom = -d;
            mainLight.shadow.bias = -0.0005;
            scene.add(mainLight);

            // Luz de preenchimento fria (Fill Light)
            const fillLight = new THREE.DirectionalLight(0xe0f2fe, 0.45);
            fillLight.position.set(-4.5, 2.5, 3);
            scene.add(fillLight);

            // Luz de contorno traseira (Rim Light) para destacar o branco no fundo claro
            const rimLight = new THREE.DirectionalLight(0xffffff, 0.55);
            rimLight.position.set(0, 4, -5);
            scene.add(rimLight);
        }

        /**
         * Constrói uma textura procedural radial para simular oclusão de ambiente (sombra suave)
         */
        function createSoftShadowTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createRadialGradient(128, 128, 10, 128, 128, 124);
            gradient.addColorStop(0, 'rgba(15, 23, 42, 0.28)');
            gradient.addColorStop(0.5, 'rgba(15, 23, 42, 0.10)');
            gradient.addColorStop(1, 'rgba(15, 23, 42, 0.0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 256, 256);
            return new THREE.CanvasTexture(canvas);
        }

        /**
         * Cria a geometria curva dos olhos felizes em formato de lua crescente / arco suave
         */
        function createCrescentEyeGeometry() {
            const shape = new THREE.Shape();
            // Desenha um olho expressivo estilo Eilik (arco superior arredondado, base levemente côncava)
            shape.moveTo(-0.17, -0.03);
            shape.bezierCurveTo(-0.17, 0.09, -0.08, 0.13, 0, 0.13);
            shape.bezierCurveTo(0.08, 0.13, 0.17, 0.09, 0.17, -0.03);
            shape.bezierCurveTo(0.17, -0.07, 0.12, -0.08, 0.08, -0.05);
            shape.bezierCurveTo(0.03, -0.02, -0.03, -0.02, -0.08, -0.05);
            shape.bezierCurveTo(-0.12, -0.08, -0.17, -0.07, -0.17, -0.03);

            const extrudeSettings = {
                depth: 0.015,
                bevelEnabled: true,
                bevelSegments: 3,
                steps: 1,
                bevelSize: 0.008,
                bevelThickness: 0.008
            };
            const geom = new THREE.ExtrudeGeometry(shape, extrudeSettings);
            geom.center();
            return geom;
        }

        /**
         * Constrói todas as partes do robô utilizando primitivas e materiais PBR
         */
        function buildRobot() {
            // Materiais PBR
            const whitePlasticMat = new THREE.MeshStandardMaterial({
                color: 0xf8fafc,
                roughness: 0.28,
                metalness: 0.04
            });

            const pedestalMat = new THREE.MeshStandardMaterial({
                color: 0xf1f5f9,
                roughness: 0.35,
                metalness: 0.05
            });

            const tealAccentMat = new THREE.MeshStandardMaterial({
                color: 0x3b82a6, // Azul petróleo / teal profissional
                roughness: 0.32,
                metalness: 0.08
            });

            const darkJointMat = new THREE.MeshStandardMaterial({
                color: 0x1e293b,
                roughness: 0.45,
                metalness: 0.3
            });

            const lightGrayMat = new THREE.MeshStandardMaterial({
                color: 0xcbd5e1,
                roughness: 0.4,
                metalness: 0.1
            });

            // Visor preto brilhante (Glossy)
            const glossyVisorMat = new THREE.MeshPhysicalMaterial({
                color: 0x06090e,
                roughness: 0.08,
                metalness: 0.1,
                clearcoat: 1.0,
                clearcoatRoughness: 0.06,
                reflectivity: 0.95
            });

            // Material emissivo azul ciano brilhante para os olhos
            const cyanEyeMat = new THREE.MeshBasicMaterial({
                color: 0x00e5ff
            });

            // --- 1. PEDESTAL CIRCULAR (BASE FIXA) ---
            const baseGroup = new THREE.Group();
            scene.add(baseGroup);

            // Disco principal do pedestal
            const pedestalGeo = new THREE.CylinderGeometry(1.18, 1.24, 0.11, 64);
            const pedestalMesh = new THREE.Mesh(pedestalGeo, pedestalMat);
            pedestalMesh.position.y = 0.055;
            pedestalMesh.receiveShadow = true;
            pedestalMesh.castShadow = true;
            baseGroup.add(pedestalMesh);

            // Anel sutil de acabamento na borda superior do pedestal
            const ringGeo = new THREE.TorusGeometry(1.17, 0.012, 16, 64);
            const ringMesh = new THREE.Mesh(ringGeo, lightGrayMat);
            ringMesh.rotation.x = Math.PI / 2;
            ringMesh.position.y = 0.11;
            baseGroup.add(ringMesh);

            // Sombra de contato no chão abaixo do pedestal
            const floorShadowGeo = new THREE.PlaneGeometry(3.2, 3.2);
            const floorShadowMat = new THREE.MeshBasicMaterial({
                map: createSoftShadowTexture(),
                transparent: true,
                depthWrite: false
            });
            const floorShadow = new THREE.Mesh(floorShadowGeo, floorShadowMat);
            floorShadow.rotation.x = -Math.PI / 2;
            floorShadow.position.y = 0.002;
            baseGroup.add(floorShadow);

            // Sombra dinâmica projetada pelo robô flutuante sobre o pedestal
            const hoverShadowGeo = new THREE.PlaneGeometry(1.35, 1.35);
            baseShadowMesh = new THREE.Mesh(hoverShadowGeo, floorShadowMat);
            baseShadowMesh.rotation.x = -Math.PI / 2;
            baseShadowMesh.position.y = 0.113;
            baseGroup.add(baseShadowMesh);

            // --- GRUPO RAIZ DO ROBÔ FLUTUANTE ---
            robotRoot = new THREE.Group();
            robotRoot.position.y = 0.24; // Flutua levemente acima do pedestal
            scene.add(robotRoot);

            // --- 2. CORPO / TORSO OVOIDE ---
            torsoGroup = new THREE.Group();
            robotRoot.add(torsoGroup);

            // Corpo principal (esfera alongada verticalmente formando um ovoide perfeito)
            const bodyGeo = new THREE.SphereGeometry(0.64, 48, 48);
            bodyGeo.scale(0.96, 1.28, 0.90);
            const bodyMesh = new THREE.Mesh(bodyGeo, whitePlasticMat);
            bodyMesh.position.y = 0.78;
            bodyMesh.castShadow = true;
            bodyMesh.receiveShadow = true;
            torsoGroup.add(bodyMesh);

            // Detalhe frontal azul petróleo ("gola / babador" característico no peito)
            // Parte superior da gola ao redor do pescoço
            const collarRingGeo = new THREE.CylinderGeometry(0.36, 0.48, 0.14, 32);
            const collarRingMesh = new THREE.Mesh(collarRingGeo, tealAccentMat);
            collarRingMesh.position.set(0, 1.44, 0.02);
            collarRingMesh.scale.set(1.05, 1, 0.92);
            torsoGroup.add(collarRingMesh);

            // Língua/gravata frontal azul que desce no centro do peito
            const bibGeo = new THREE.BoxGeometry(0.24, 0.42, 0.16);
            // Arredondando usando uma cápsula frontal ajustada à curvatura do peito
            const bibPillGeo = new THREE.CylinderGeometry(0.115, 0.105, 0.34, 24);
            const bibPillMesh = new THREE.Mesh(bibPillGeo, tealAccentMat);
            bibPillMesh.position.set(0, 1.25, 0.51);
            bibPillMesh.rotation.x = -0.22; // Acompanha a inclinação do tórax
            bibPillMesh.scale.set(1, 1, 0.45);
            torsoGroup.add(bibPillMesh);

            // Ponta inferior arredondada do detalhe azul no peito
            const bibTipGeo = new THREE.SphereGeometry(0.105, 24, 24);
            const bibTipMesh = new THREE.Mesh(bibTipGeo, tealAccentMat);
            bibTipMesh.position.set(0, 1.09, 0.545);
            bibTipMesh.scale.set(1, 0.9, 0.45);
            torsoGroup.add(bibTipMesh);

            // Cavidades laterais cinzas dos ombros (sockets)
            [-1, 1].forEach(side => {
                const socketGeo = new THREE.SphereGeometry(0.22, 24, 24);
                const socketMesh = new THREE.Mesh(socketGeo, lightGrayMat);
                socketMesh.position.set(side * 0.54, 1.14, 0);
                socketMesh.scale.set(0.5, 1.1, 0.95);
                torsoGroup.add(socketMesh);
            });

            // Pescoço cilíndrico escuro conectando torso e cabeça
            const neckGeo = new THREE.CylinderGeometry(0.24, 0.28, 0.18, 32);
            const neckMesh = new THREE.Mesh(neckGeo, darkJointMat);
            neckMesh.position.y = 1.54;
            torsoGroup.add(neckMesh);

            // --- 3. BRAÇOS ARTICULADOS ---
            function createArm(isLeft) {
                const side = isLeft ? -1 : 1;
                const pivot = new THREE.Group();
                pivot.position.set(side * 0.65, 1.18, 0);

                // Esfera da articulação do ombro (preto/cinza escuro)
                const jointGeo = new THREE.SphereGeometry(0.135, 24, 24);
                const jointMesh = new THREE.Mesh(jointGeo, darkJointMat);
                pivot.add(jointMesh);

                // Grupo do braço em si (para inclinação natural)
                const armBody = new THREE.Group();
                armBody.position.set(side * 0.11, -0.34, 0.02);
                armBody.rotation.z = side * -0.14; // Leve abertura natural
                pivot.add(armBody);

                // Parte branca externa do braço (cápsula suave)
                const armGeo = new THREE.SphereGeometry(0.15, 32, 32);
                armGeo.scale(0.82, 2.55, 0.95);
                const armMesh = new THREE.Mesh(armGeo, whitePlasticMat);
                armMesh.castShadow = true;
                armBody.add(armMesh);

                // Detalhe interno sutil em azul/cinza na face interna do braço
                const innerAccentGeo = new THREE.SphereGeometry(0.135, 24, 24);
                innerAccentGeo.scale(0.65, 2.25, 0.78);
                const innerAccentMesh = new THREE.Mesh(innerAccentGeo, lightGrayMat);
                innerAccentMesh.position.set(-side * 0.045, -0.02, 0);
                armBody.add(innerAccentMesh);

                return pivot;
            }

            leftArmPivot = createArm(true);
            rightArmPivot = createArm(false);
            torsoGroup.add(leftArmPivot);
            torsoGroup.add(rightArmPivot);

            // --- 4. CABEÇA ESFÉRICA ACHATADA E VISOR ---
            headGroup = new THREE.Group();
            headGroup.position.set(0, 1.62, 0); // Ponto de pivô no pescoço
            torsoGroup.add(headGroup);

            // Capacete/Cabeça branca principal
            const headGeo = new THREE.SphereGeometry(0.74, 48, 48);
            headGeo.scale(1.08, 0.92, 0.96);
            const headMesh = new THREE.Mesh(headGeo, whitePlasticMat);
            headMesh.position.y = 0.56;
            headMesh.castShadow = true;
            headMesh.receiveShadow = true;
            headGroup.add(headMesh);

            // Detalhe superior azul petróleo no topo da cabeça (tampa arredondada)
            const topCapGeo = new THREE.SphereGeometry(0.36, 32, 24, 0, Math.PI * 2, 0, Math.PI * 0.36);
            topCapGeo.scale(1.15, 0.45, 0.95);
            const topCapMesh = new THREE.Mesh(topCapGeo, tealAccentMat);
            topCapMesh.position.set(0, 1.09, -0.02);
            headGroup.add(topCapMesh);

            // Orelhas / Fones laterais arredondados (cinza escuro interno + concha branca externa)
            [-1, 1].forEach(side => {
                const earGroup = new THREE.Group();
                earGroup.position.set(side * 0.78, 0.54, 0);

                // Base escura interna da orelha
                const earInnerGeo = new THREE.CylinderGeometry(0.17, 0.19, 0.08, 24);
                earInnerGeo.rotateZ(Math.PI / 2);
                const earInnerMesh = new THREE.Mesh(earInnerGeo, darkJointMat);
                earGroup.add(earInnerMesh);

                // Concha externa branca arredondada
                const earOuterGeo = new THREE.SphereGeometry(0.18, 24, 24);
                earOuterGeo.scale(0.45, 1.05, 0.95);
                const earOuterMesh = new THREE.Mesh(earOuterGeo, whitePlasticMat);
                earOuterMesh.position.x = side * 0.045;
                earOuterMesh.castShadow = true;
                earGroup.add(earOuterMesh);

                headGroup.add(earGroup);
            });

            // --- 5. VISOR PRETO BRILHANTE E OLHOS CIANO ---
            visorGroup = new THREE.Group();
            visorGroup.position.set(0, 0.54, 0.05);
            headGroup.add(visorGroup);

            // Tela/Visor preto brilhante embutido na frente da cabeça
            const visorGeo = new THREE.SphereGeometry(0.58, 48, 48);
            visorGeo.scale(1.06, 0.84, 0.92);
            const visorMesh = new THREE.Mesh(visorGeo, glossyVisorMat);
            visorMesh.position.z = 0.14;
            visorGroup.add(visorMesh);

            // Olhos Ciano Emissivos (Posicionados na superfície curva frontal do visor)
            const eyeGeo = createCrescentEyeGeometry();

            leftEyeMesh = new THREE.Mesh(eyeGeo, cyanEyeMat);
            leftEyeMesh.position.set(-0.21, 0.04, 0.655);
            leftEyeMesh.rotation.y = -0.26;
            leftEyeMesh.rotation.z = 0.08;
            visorGroup.add(leftEyeMesh);

            rightEyeMesh = new THREE.Mesh(eyeGeo, cyanEyeMat);
            rightEyeMesh.position.set(0.21, 0.04, 0.655);
            rightEyeMesh.rotation.y = 0.26;
            rightEyeMesh.rotation.z = -0.08;
            visorGroup.add(rightEyeMesh);
        }

        /**
         * Configura eventos de redimensionamento e rastreamento de mouse/toque
         */
        function setupEvents() {
            window.addEventListener('resize', onWindowResize, false);

            // Rastreamento suave do ponteiro do mouse
            window.addEventListener('mousemove', (e) => {
                state.mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                state.mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            }, false);

            // Suporte a toque em dispositivos móveis para olhar na direção tocada
            window.addEventListener('touchmove', (e) => {
                if (e.touches.length > 0) {
                    state.mouse.x = (e.touches[0].clientX / window.innerWidth) * 2 - 1;
                    state.mouse.y = -(e.touches[0].clientY / window.innerHeight) * 2 + 1;
                }
            }, { passive: true });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        /**
         * Dispara as animações interativas pelos botões inferiores
         */
        window.triggerAction = function(actionName) {
            state.action = actionName;
            state.actionTimer = 0;

            // Atualiza feedback visual nos botões
            document.querySelectorAll('.btn-action').forEach(btn => btn.classList.remove('active-state'));
            const activeBtn = document.getElementById(`btn-${actionName}`);
            if (activeBtn) activeBtn.classList.add('active-state');

            if (actionName === 'wave') {
                state.actionDuration = 2.4;
            } else if (actionName === 'happy') {
                state.actionDuration = 2.0;
            } else if (actionName === 'curious') {
                state.actionDuration = 2.4;
            }
        };

        /**
         * Loop principal de animação (60fps)
         */
        function animate() {
            requestAnimationFrame(animate);

            const delta = Math.min(clock.getDelta(), 0.1);
            const elapsed = clock.getElapsedTime();

            // 1. Animação de Flutuação Contínua (Idle Bobbing)
            const floatOffset = Math.sin(elapsed * 2.2) * 0.045;
            let extraBounce = 0;

            // 2. Piscar de Olhos Automático (Blink)
            state.blinkTimer -= delta;
            if (state.blinkTimer <= 0 && !state.isBlinking) {
                state.isBlinking = true;
                state.blinkProgress = 0;
            }

            let eyeScaleY = 1.0;
            let eyeScaleX = 1.0;

            if (state.isBlinking) {
                state.blinkProgress += delta * 11; // Piscada rápida e natural
                if (state.blinkProgress >= Math.PI) {
                    state.isBlinking = false;
                    state.blinkTimer = 2.2 + Math.random() * 3.0; // Próxima piscada aleatória
                    eyeScaleY = 1.0;
                } else {
                    eyeScaleY = Math.max(0.08, Math.cos(state.blinkProgress));
                }
            }

            // 3. Processamento das Ações Interativas (Acenar, Feliz, Curioso)
            let targetHeadRotZ = 0;
            let targetHeadRotX = 0;
            let targetHeadRotY = 0;
            let targetRightArmZ = 0;
            let targetRightArmX = 0;
            let targetLeftArmZ = 0;
            let targetTorsoRotZ = 0;

            if (state.action !== 'idle') {
                state.actionTimer += delta;
                const progress = state.actionTimer / state.actionDuration;

                if (progress >= 1.0) {
                    // Retorna suavemente ao estado idle
                    state.action = 'idle';
                    document.querySelectorAll('.btn-action').forEach(btn => btn.classList.remove('active-state'));
                } else {
                    // Envelope suave de entrada e saída (0 -> 1 -> 0)
                    const envelope = Math.sin(progress * Math.PI);

                    if (state.action === 'wave') {
                        // Levanta o braço direito (do ponto de vista do robô / esquerda na tela) e acena
                        const waveOscillation = Math.sin(state.actionTimer * 10) * 0.28;
                        targetRightArmZ = envelope * (2.35 + waveOscillation);
                        targetRightArmX = envelope * -0.25;
                        targetHeadRotZ = envelope * -0.14;
                        targetTorsoRotZ = envelope * -0.05;
                        eyeScaleY *= (1 + envelope * 0.15);
                    } 
                    else if (state.action === 'happy') {
                        // Pulinho alegre + olhos apertadinhos de felicidade
                        extraBounce = Math.abs(Math.sin(state.actionTimer * 7.5)) * 0.14 * envelope;
                        eyeScaleY = 1.0 - (envelope * 0.42);
                        eyeScaleX = 1.0 + (envelope * 0.16);
                        targetRightArmZ = envelope * 0.55;
                        targetLeftArmZ = envelope * -0.55;
                        targetHeadRotX = envelope * -0.08;
                    } 
                    else if (state.action === 'curious') {
                        // Inclina a cabeça para o lado como se estivesse analisando algo
                        targetHeadRotZ = envelope * 0.32;
                        targetHeadRotY = envelope * 0.18;
                        targetTorsoRotZ = envelope * 0.06;
                        // Um olho levemente maior que o outro (expressão curiosa)
                        leftEyeMesh.scale.set(1.0 + envelope * 0.12, 1.0 + envelope * 0.18, 1);
                        rightEyeMesh.scale.set(1.0 - envelope * 0.05, 1.0 - envelope * 0.12, 1);
                    }
                }
            }

            // Aplica escala dos olhos (exceto quando 'curious' controla individualmente)
            if (state.action !== 'curious') {
                leftEyeMesh.scale.set(eyeScaleX, eyeScaleY, 1);
                rightEyeMesh.scale.set(eyeScaleX, eyeScaleY, 1);
            }

            // 4. Rastreamento Suave do Cursor (Mouse Tracking)
            state.currentLook.x += (state.mouse.x - state.currentLook.x) * 0.07;
            state.currentLook.y += (state.mouse.y - state.currentLook.y) * 0.07;

            // Combina o rastreamento do mouse com a pose da animação atual
            const finalHeadRotY = (state.currentLook.x * 0.38) + targetHeadRotY;
            const finalHeadRotX = (-state.currentLook.y * 0.24) + targetHeadRotX;

            headGroup.rotation.y += (finalHeadRotY - headGroup.rotation.y) * 0.12;
            headGroup.rotation.x += (finalHeadRotX - headGroup.rotation.x) * 0.12;
            headGroup.rotation.z += (targetHeadRotZ - headGroup.rotation.z) * 0.12;

            // Sutil deslocamento dos olhos dentro do visor para maior profundidade 3D
            leftEyeMesh.position.x = -0.21 + state.currentLook.x * 0.035;
            leftEyeMesh.position.y = 0.04 + state.currentLook.y * 0.025;
            rightEyeMesh.position.x = 0.21 + state.currentLook.x * 0.035;
            rightEyeMesh.position.y = 0.04 + state.currentLook.y * 0.025;

            // 5. Interpolação Suave dos Braços e Torso
            // Braço esquerdo (lado direito da tela)
            rightArmPivot.rotation.z += (targetRightArmZ - rightArmPivot.rotation.z) * 0.14;
            rightArmPivot.rotation.x += (targetRightArmX - rightArmPivot.rotation.x) * 0.14;
            // Balanço sutil natural em idle
            leftArmPivot.rotation.z += ((targetLeftArmZ - Math.sin(elapsed * 2.2) * 0.04) - leftArmPivot.rotation.z) * 0.14;

            torsoGroup.rotation.z += (targetTorsoRotZ - torsoGroup.rotation.z) * 0.1;
            torsoGroup.rotation.y = state.currentLook.x * 0.08;

            // Posição vertical final do robô e escala da sombra no pedestal
            robotRoot.position.y = 0.24 + floatOffset + extraBounce;
            const shadowScale = 1.0 - (floatOffset + extraBounce) * 0.85;
            baseShadowMesh.scale.set(shadowScale, shadowScale, 1);

            controls.update();
            renderer.render(scene, camera);
        }
    </script>
