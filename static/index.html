<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Feira Cultural TI · BYTE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    /* ============================================================
       RESET & TOKENS
    ============================================================ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --blue:      #2563EB;
      --blue-lt:   #60A5FA;
      --blue-dk:   #1D4ED8;
      --bg:        #0A0F1E;
      --surface:   #111827;
      --surface-2: #1A2235;
      --border:    rgba(96,165,250,0.15);
      --border-hi: rgba(96,165,250,0.4);
      --text:      #E2E8F0;
      --text-muted:#64748B;
      --white:     #FFFFFF;
      --glow:      0 0 24px rgba(37,99,235,0.45);
      --glow-sm:   0 0 10px rgba(37,99,235,0.35);
    }
    html { scroll-behavior: smooth; height: 100%; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ============================================================
       BACKGROUND
    ============================================================ */
    #bg-canvas {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
    }
    .bg-layer {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background:
        radial-gradient(ellipse 60% 50% at 50% 0%,   rgba(37,99,235,0.12) 0%, transparent 100%),
        radial-gradient(ellipse 40% 30% at 80% 80%,  rgba(29,78,216,0.08) 0%, transparent 100%),
        linear-gradient(180deg, #0A0F1E 0%, #0D1526 100%);
    }

    /* ============================================================
       HEADER — minimal top bar
    ============================================================ */
    header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      height: 56px;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 1.5rem;
      background: rgba(10,15,30,0.85);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
    }
    .logo {
      display: flex; align-items: center; gap: 0.5rem;
      text-decoration: none;
    }
    .logo-mark {
      width: 30px; height: 30px;
      background: var(--blue);
      clip-path: polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);
      display: flex; align-items: center; justify-content: center;
      box-shadow: var(--glow-sm);
    }
    .logo-mark svg { width: 14px; height: 14px; }
    .logo-name {
      font-size: 0.95rem; font-weight: 700; letter-spacing: 0.5px;
      color: var(--white);
    }
    .logo-name span { color: var(--blue-lt); }
    .header-right { display: flex; align-items: center; gap: 0.75rem; }
    .status-pill {
      display: flex; align-items: center; gap: 0.4rem;
      background: rgba(17,24,39,0.8);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 0.25rem 0.75rem;
      font-size: 0.72rem; font-weight: 500; color: var(--text-muted);
    }
    .status-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--text-muted);
    }
    .status-dot.online  { background: #22C55E; box-shadow: 0 0 6px #22C55E; animation: s-pulse 2s infinite; }
    .status-dot.offline { background: #EF4444; }
    @keyframes s-pulse {
      0%,100% { box-shadow: 0 0 6px rgba(34,197,94,0.6); }
      50%      { box-shadow: 0 0 12px rgba(34,197,94,0.9); }
    }

    /* ============================================================
       MAIN WRAPPER — single column, vertically stacked
    ============================================================ */
    main {
      position: relative; z-index: 1;
      flex: 1;
      display: flex; flex-direction: column; align-items: center;
      padding: 72px 1rem 2rem;
      gap: 0;
    }

    /* ============================================================
       ROBOT NAME BADGE
    ============================================================ */
    .robot-label {
      text-align: center;
      margin-bottom: 0.5rem;
    }
    .robot-label h1 {
      font-size: 1.1rem; font-weight: 700; color: var(--white);
      letter-spacing: 0.5px;
    }
    .robot-label p {
      font-size: 0.72rem; font-weight: 400; color: var(--text-muted);
      letter-spacing: 1.5px; text-transform: uppercase;
      margin-top: 0.1rem;
    }

    /* ============================================================
       ROBOT — BYTE (minimalista, tecnológico, geométrico)
    ============================================================ */
    .robot-stage {
      position: relative;
      display: flex; flex-direction: column; align-items: center;
      width: 220px;
      flex-shrink: 0;
      cursor: pointer;
      user-select: none;
    }
    #byte-svg {
      width: 180px; height: auto;
      animation: idle-float 4s ease-in-out infinite;
      filter: drop-shadow(0 0 18px rgba(37,99,235,0.5));
      transition: filter 0.3s;
    }
    #byte-svg.state-talking   { animation: talk-bob 0.35s ease-in-out infinite alternate; }
    #byte-svg.state-thinking  { animation: think-tilt 1.2s ease-in-out infinite; }
    #byte-svg.state-listening { filter: drop-shadow(0 0 24px rgba(239,68,68,0.6)); }

    @keyframes idle-float {
      0%,100% { transform: translateY(0px); }
      50%      { transform: translateY(-7px); }
    }
    @keyframes talk-bob {
      from { transform: translateY(-3px); }
      to   { transform: translateY(-6px); }
    }
    @keyframes think-tilt {
      0%,100% { transform: translateY(0) rotate(-0.8deg); }
      50%      { transform: translateY(-5px) rotate(0.8deg); }
    }

    /* ---- Antenna ---- */
    .ant-line { stroke: #334155; stroke-width: 2; }
    .ant-dot  {
      fill: var(--blue-lt);
      filter: url(#glow-filter);
      animation: ant-blink 2s ease-in-out infinite;
    }
    .state-thinking .ant-dot { animation: ant-blink 0.45s ease-in-out infinite; }
    @keyframes ant-blink {
      0%,100% { opacity: 1; }
      50%      { opacity: 0.2; }
    }

    /* ---- Visor / eyes ---- */
    .visor-bg { fill: #060D1A; }
    .eye-l, .eye-r {
      fill: var(--blue-lt);
      filter: url(#glow-filter);
      transition: all 0.15s;
    }
    .state-talking .eye-l,
    .state-talking .eye-r { animation: eye-pop 0.35s ease-in-out infinite alternate; }
    @keyframes eye-pop {
      from { opacity: 0.85; }
      to   { opacity: 1; filter: url(#glow-filter-hi); }
    }
    .state-thinking .eye-l { animation: eye-scan 1.2s linear infinite; }
    .state-thinking .eye-r { animation: eye-scan 1.2s linear infinite 0.6s; }
    @keyframes eye-scan {
      0%,100% { transform: translateX(0); }
      25%      { transform: translateX(3px); }
      75%      { transform: translateX(-3px); }
    }

    /* ---- Mouth / status bar ---- */
    #mouth-idle    { display: block; }
    #mouth-talking { display: none; }
    #mouth-thinking{ display: none; }
    .state-talking  #mouth-idle     { display: none; }
    .state-talking  #mouth-talking  { display: block; }
    .state-thinking #mouth-idle     { display: none; }
    .state-thinking #mouth-thinking { display: block; }
    .state-talking #mouth-talking rect { animation: mouth-open 0.3s ease-in-out infinite alternate; }
    @keyframes mouth-open {
      from { height: 3px; y: 110; }
      to   { height: 7px; y: 108; }
    }

    /* ---- Scan line on body ---- */
    .scan-line {
      animation: scan 3s linear infinite;
      opacity: 0.5;
    }
    @keyframes scan {
      0%   { transform: translateY(-30px); opacity: 0; }
      10%  { opacity: 0.5; }
      90%  { opacity: 0.5; }
      100% { transform: translateY(80px); opacity: 0; }
    }

    /* ---- Listening ring ---- */
    .listen-ring {
      position: absolute;
      top: 50%; left: 50%;
      width: 200px; height: 200px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      border: 2px solid rgba(239,68,68,0.6);
      display: none;
      animation: ring-pulse 1s ease-in-out infinite;
      pointer-events: none;
    }
    .state-listening ~ .listen-ring,
    #byte-svg.state-listening + .listen-ring { display: block; }
    @keyframes ring-pulse {
      0%   { transform: translate(-50%,-50%) scale(1); opacity: 0.8; }
      100% { transform: translate(-50%,-50%) scale(1.5); opacity: 0; }
    }

    /* ============================================================
       INTERACTION ZONE — voz + texto (destaque principal)
    ============================================================ */
    .interaction-zone {
      width: 100%;
      max-width: 520px;
      margin-top: 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }

    /* Big mic button */
    .mic-cta-wrap { display: flex; flex-direction: column; align-items: center; gap: 0.5rem; }
    .btn-mic-big {
      width: 72px; height: 72px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      background: var(--surface-2);
      border: 2px solid var(--border-hi);
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s, background 0.2s;
      position: relative;
      box-shadow: var(--glow-sm);
    }
    .btn-mic-big svg { width: 28px; height: 28px; fill: none; stroke: var(--blue-lt); stroke-width: 2; }
    .btn-mic-big:hover {
      transform: scale(1.07);
      box-shadow: var(--glow);
      border-color: var(--blue-lt);
    }
    .btn-mic-big:active { transform: scale(0.95); }
    .btn-mic-big.listening {
      background: rgba(239,68,68,0.12);
      border-color: rgba(239,68,68,0.7);
      animation: mic-ring 1.2s ease-in-out infinite;
    }
    .btn-mic-big.listening svg { stroke: #EF4444; }
    @keyframes mic-ring {
      0%,100% { box-shadow: 0 0 0 0 rgba(239,68,68,0.5); }
      50%      { box-shadow: 0 0 0 14px rgba(239,68,68,0); }
    }
    .mic-label {
      font-size: 0.72rem; color: var(--text-muted); letter-spacing: 0.5px; font-weight: 500;
      transition: color 0.2s;
    }
    .btn-mic-big.listening ~ .mic-label { color: #EF4444; }

    /* Divider */
    .divider {
      display: flex; align-items: center; gap: 0.75rem; width: 100%;
    }
    .divider-line { flex: 1; height: 1px; background: var(--border); }
    .divider-txt { font-size: 0.7rem; color: var(--text-muted); letter-spacing: 1px; white-space: nowrap; }

    /* Text input row */
    .text-row {
      display: flex; align-items: center; gap: 0.5rem; width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 0.5rem 0.5rem 0.5rem 1rem;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .text-row:focus-within {
      border-color: var(--border-hi);
      box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
    }
    #chat-input {
      flex: 1; background: none; border: none; outline: none;
      color: var(--text); font-family: inherit; font-size: 0.9rem;
      min-width: 0;
    }
    #chat-input::placeholder { color: var(--text-muted); }
    .btn-send {
      width: 38px; height: 38px; border-radius: 10px; border: none;
      cursor: pointer; flex-shrink: 0;
      background: var(--blue);
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.2s, background 0.2s;
      box-shadow: var(--glow-sm);
    }
    .btn-send:hover  { background: var(--blue-dk); transform: scale(1.07); }
    .btn-send:active { transform: scale(0.93); }
    .btn-send svg { width: 16px; height: 16px; fill: none; stroke: white; stroke-width: 2.5; }

    /* ============================================================
       TOPIC CHIPS — compact, horizontal scroll
    ============================================================ */
    .chips-wrap {
      width: 100%;
      max-width: 520px;
      display: flex;
      gap: 0.5rem;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
    }
    .chips-wrap::-webkit-scrollbar { display: none; }
    .chip {
      display: inline-flex; align-items: center; gap: 0.35rem;
      flex-shrink: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 0.35rem 0.85rem;
      font-size: 0.75rem; font-weight: 500; color: var(--text-muted);
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s, background 0.2s;
      white-space: nowrap;
    }
    .chip:hover {
      border-color: var(--border-hi);
      color: var(--blue-lt);
      background: rgba(37,99,235,0.08);
    }
    .chip svg { width: 13px; height: 13px; }

    /* ============================================================
       HISTORY — discreto, embaixo
    ============================================================ */
    .history-panel {
      width: 100%;
      max-width: 520px;
      margin-top: 0.75rem;
    }
    .history-toggle {
      width: 100%;
      background: none; border: none;
      cursor: pointer;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.6rem 0.75rem;
      color: var(--text-muted);
      font-size: 0.72rem; font-weight: 500; letter-spacing: 0.5px;
      text-transform: uppercase;
      border-radius: 10px;
      border: 1px solid transparent;
      transition: background 0.2s, border-color 0.2s;
    }
    .history-toggle:hover { background: var(--surface); border-color: var(--border); }
    .toggle-arrow { transition: transform 0.3s; font-style: normal; }
    .history-panel.open .toggle-arrow { transform: rotate(180deg); }
    .history-body {
      display: none;
      flex-direction: column;
      gap: 0.5rem;
      max-height: 320px;
      overflow-y: auto;
      padding: 0.5rem 0.25rem;
      scrollbar-width: thin;
      scrollbar-color: rgba(96,165,250,0.2) transparent;
    }
    .history-body::-webkit-scrollbar { width: 3px; }
    .history-body::-webkit-scrollbar-thumb { background: rgba(96,165,250,0.2); border-radius: 2px; }
    .history-panel.open .history-body { display: flex; }

    /* Messages */
    .msg { display: flex; gap: 0.5rem; align-items: flex-end; max-width: 100%; animation: msg-in 0.25s ease; }
    @keyframes msg-in {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .msg.user { flex-direction: row-reverse; align-self: flex-end; }
    .msg.bot  { align-self: flex-start; }
    .msg-av {
      width: 24px; height: 24px; border-radius: 50%; flex-shrink: 0;
      background: var(--surface-2);
      border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.65rem; color: var(--blue-lt);
    }
    .msg-bub {
      max-width: 85%;
      padding: 0.55rem 0.9rem;
      border-radius: 12px;
      font-size: 0.82rem;
      line-height: 1.55;
      word-break: break-word;
    }
    .msg.user .msg-bub {
      background: var(--blue);
      color: #fff;
      border-radius: 12px 12px 3px 12px;
    }
    .msg.bot .msg-bub {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 12px 12px 12px 3px;
    }

    /* Typing indicator */
    .typing-row {
      display: none; align-items: center; gap: 0.5rem;
    }
    .typing-row.active { display: flex; }
    .typing-bub {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px 12px 12px 3px;
      padding: 0.55rem 0.9rem;
      display: flex; gap: 4px;
    }
    .td {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--blue-lt);
      animation: td-bounce 1.1s infinite;
    }
    .td:nth-child(2) { animation-delay: 0.18s; }
    .td:nth-child(3) { animation-delay: 0.36s; }
    @keyframes td-bounce {
      0%,60%,100% { transform: translateY(0); opacity: 0.4; }
      30%          { transform: translateY(-5px); opacity: 1; }
    }

    /* ============================================================
       FOOTER
    ============================================================ */
    footer {
      position: relative; z-index: 1;
      border-top: 1px solid var(--border);
      padding: 1rem 1.5rem;
      text-align: center;
      font-size: 0.72rem; color: var(--text-muted);
      background: rgba(10,15,30,0.7);
    }
    footer a { color: var(--text-muted); text-decoration: none; }
    footer a:hover { color: var(--blue-lt); }

    /* ============================================================
       RESPONSIVE
    ============================================================ */
    @media (max-width: 480px) {
      #byte-svg { width: 150px; }
      .btn-mic-big { width: 60px; height: 60px; }
      .btn-mic-big svg { width: 24px; height: 24px; }
    }
  </style>
</head>
<body>

  <div class="bg-layer"></div>
  <canvas id="bg-canvas"></canvas>

  <!-- ==================== HEADER ==================== -->
  <header>
    <a class="logo" href="#">
      <div class="logo-mark">
        <svg viewBox="0 0 14 14" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round">
          <circle cx="7" cy="7" r="2"/>
          <line x1="7" y1="1" x2="7" y2="3"/>
          <line x1="7" y1="11" x2="7" y2="13"/>
          <line x1="1" y1="7" x2="3" y2="7"/>
          <line x1="11" y1="7" x2="13" y2="7"/>
        </svg>
      </div>
      <span class="logo-name">Feira<span>TI</span></span>
    </a>
    <div class="header-right">
      <div class="status-pill">
        <div class="status-dot" id="status-dot"></div>
        <span id="status-text">···</span>
      </div>
    </div>
  </header>

  <!-- ==================== MAIN ==================== -->
  <main>

    <!-- Robot name above -->
    <div class="robot-label">
      <h1>BYTE</h1>
      <p>Assistente Virtual · Feira TI 2026</p>
    </div>

    <!-- ======= ROBOT SVG ======= -->
    <div class="robot-stage" id="robot-stage">
      <svg id="byte-svg" viewBox="0 0 160 240" xmlns="http://www.w3.org/2000/svg" aria-label="Robô BYTE">
        <defs>
          <!-- Glow filter normal -->
          <filter id="glow-filter" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="2.5" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
          <!-- Glow filter intenso -->
          <filter id="glow-filter-hi" x="-60%" y="-60%" width="220%" height="220%">
            <feGaussianBlur stdDeviation="4" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
          <!-- Clip para scan line -->
          <clipPath id="body-clip">
            <rect x="34" y="118" width="92" height="80" rx="10"/>
          </clipPath>
          <!-- Gradiente corpo -->
          <linearGradient id="body-grad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%"   stop-color="#161E30"/>
            <stop offset="100%" stop-color="#0A0F1E"/>
          </linearGradient>
          <!-- Gradiente cabeça -->
          <linearGradient id="head-grad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%"   stop-color="#1A2540"/>
            <stop offset="100%" stop-color="#111827"/>
          </linearGradient>
          <!-- Gradiente visor -->
          <linearGradient id="visor-grad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%"   stop-color="#060D1A"/>
            <stop offset="100%" stop-color="#030710"/>
          </linearGradient>
        </defs>

        <!-- ===== ANTENNA ===== -->
        <line class="ant-line" x1="80" y1="12" x2="80" y2="34"/>
        <!-- antenna horizontal detail -->
        <line x1="72" y1="22" x2="88" y2="22" stroke="#1D4ED8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
        <circle class="ant-dot" cx="80" cy="10" r="4"/>

        <!-- ===== HEAD ===== -->
        <!-- Head shadow -->
        <rect x="27" y="38" width="106" height="78" rx="12" fill="rgba(0,0,0,0.3)" transform="translate(1,2)"/>
        <!-- Head body -->
        <rect x="27" y="36" width="106" height="78" rx="12" fill="url(#head-grad)" stroke="#1D4ED8" stroke-width="1.2"/>
        <!-- Top edge highlight -->
        <rect x="34" y="37" width="60" height="2" rx="1" fill="rgba(96,165,250,0.15)"/>
        <!-- Head frame inner -->
        <rect x="31" y="40" width="98" height="70" rx="9" fill="none" stroke="rgba(37,99,235,0.2)" stroke-width="0.8"/>

        <!-- ===== VISOR ===== -->
        <rect x="36" y="50" width="88" height="46" rx="8" fill="url(#visor-grad)" stroke="#1D4ED8" stroke-width="1"/>
        <!-- Visor glare top -->
        <rect x="40" y="52" width="40" height="6" rx="3" fill="rgba(96,165,250,0.06)"/>

        <!-- ===== EYES ===== -->
        <!-- Left eye socket -->
        <rect x="43" y="58" width="28" height="20" rx="5" fill="rgba(10,15,30,0.9)" stroke="rgba(37,99,235,0.3)" stroke-width="0.8"/>
        <!-- Left iris bar -->
        <rect class="eye-l" x="49" y="65" width="16" height="6" rx="3" filter="url(#glow-filter)"/>
        <!-- Left eye scan line -->
        <rect x="43" y="69" width="28" height="1" fill="rgba(96,165,250,0.08)"/>

        <!-- Right eye socket -->
        <rect x="89" y="58" width="28" height="20" rx="5" fill="rgba(10,15,30,0.9)" stroke="rgba(37,99,235,0.3)" stroke-width="0.8"/>
        <!-- Right iris bar -->
        <rect class="eye-r" x="95" y="65" width="16" height="6" rx="3" filter="url(#glow-filter)"/>
        <!-- Right eye scan line -->
        <rect x="89" y="69" width="28" height="1" fill="rgba(96,165,250,0.08)"/>

        <!-- ===== STATUS BAR (mouth area) ===== -->
        <rect x="44" y="86" width="72" height="4" rx="2" fill="rgba(10,15,30,0.9)" stroke="rgba(37,99,235,0.2)" stroke-width="0.8"/>
        <!-- Idle: static bar fill -->
        <g id="mouth-idle">
          <rect x="52" y="87" width="40" height="2" rx="1" fill="#2563EB" opacity="0.7"/>

  <!-- ==================== SCRIPTS ==================== -->
  <script>
  (function () {
    'use strict';

    /* ============================================================
       0. PARTICLES (canvas background)
    ============================================================ */
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    const tokens = ['</', '/>', '{}', '[]', '01', '10', '#', '&&', '=>', '0x'];
    let particles = [];

    function resizeCanvas() {
      canvas.width  = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    function spawnParticle() {
      return {
        x:    Math.random() * canvas.width,
        y:    canvas.height + 20,
        text: tokens[Math.floor(Math.random() * tokens.length)],
        speed: 0.3 + Math.random() * 0.5,
        opacity: 0,
        size: 10 + Math.random() * 4,
        drift: (Math.random() - 0.5) * 0.3,
        life: 0
      };
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (Math.random() < 0.04 && particles.length < 22) particles.push(spawnParticle());
      particles = particles.filter(p => p.y > -40 && p.opacity > -0.1);
      particles.forEach(p => {
        p.y     -= p.speed;
        p.x     += p.drift;
        p.life  += 0.012;
        p.opacity = Math.sin(p.life * Math.PI) * 0.18;
        ctx.save();
        ctx.font = `${p.size}px monospace`;
        ctx.fillStyle = `rgba(96,165,250,${Math.max(0, p.opacity)})`;
        ctx.fillText(p.text, p.x, p.y);
        ctx.restore();
      });
      requestAnimationFrame(animateParticles);
    }
    animateParticles();

    /* ============================================================
       1. ROBOT STATE
    ============================================================ */
    const byteSvg    = document.getElementById('byte-svg');
    const listenRing = document.getElementById('listen-ring');

    function setRobot(state) {
      // state: 'idle' | 'talking' | 'thinking' | 'listening'
      byteSvg.className = state === 'idle' ? '' : `state-${state}`;
      listenRing.style.display = state === 'listening' ? 'block' : 'none';
    }

    // Eye parallax
    document.addEventListener('mousemove', e => {
      const svgRect = byteSvg.getBoundingClientRect();
      const cx = svgRect.left + svgRect.width  / 2;
      const cy = svgRect.top  + svgRect.height / 2;
      const dx = (e.clientX - cx) / window.innerWidth;
      const dy = (e.clientY - cy) / window.innerHeight;
      const eyeL = byteSvg.querySelector('.eye-l');
      const eyeR = byteSvg.querySelector('.eye-r');
      if (eyeL && eyeR) {
        const mx = dx * 3, my = dy * 2;
        eyeL.setAttribute('transform', `translate(${mx},${my})`);
        eyeR.setAttribute('transform', `translate(${mx},${my})`);
      }
    });

    // Click robot → greeting
    byteSvg.addEventListener('click', () => {
      if (byteSvg.className === '' || byteSvg.className.includes('idle')) {
        setRobot('talking');
        addMessage('bot', 'Oi! Pode me perguntar qualquer coisa sobre a Feira TI! 😄');
        setTimeout(() => setRobot('idle'), 3000);
      }
    });

    /* ============================================================
       2. HISTORY PANEL TOGGLE
    ============================================================ */
    const historyPanel  = document.getElementById('history-panel');
    const historyToggle = document.getElementById('history-toggle');
    const historyBody   = document.getElementById('history-body');

    historyToggle.addEventListener('click', () => {
      historyPanel.classList.toggle('open');
    });

    /* ============================================================
       3. TEXT-TO-SPEECH (Web Speech Synthesis - Resposta em Voz)
    ============================================================ */
    const synth = window.speechSynthesis;
    let ttsEnabled = true;   // Ativo por padrão
    let ttsVoice   = null;
    let currentUtterance = null; // Mantém referência para evitar garbage collection no Chrome

    function pickVoice() {
      if (!synth) return;
      const voices = synth.getVoices() || [];
      // Prioridade: pt-BR > pt-* > qualquer voz do sistema
      ttsVoice = voices.find(v => v.lang === 'pt-BR' && v.localService)
              || voices.find(v => v.lang === 'pt-BR')
              || voices.find(v => v.lang.startsWith('pt'))
              || voices[0]
              || null;
    }
    pickVoice();
    if (synth && synth.onvoiceschanged !== undefined) {
      synth.onvoiceschanged = pickVoice;
    }

    function stopSpeaking() {
      if (synth) {
        try { synth.cancel(); } catch (e) {}
      }
      currentUtterance = null;
      if (byteSvg.classList.contains('state-talking')) {
        setRobot('idle');
      }
    }

    function speak(text) {
      if (!ttsEnabled || !synth) {
        // Se TTS desativado ou não suportado, apenas anima temporariamente
        setRobot('talking');
        setTimeout(() => setRobot('idle'), 3500);
        return;
      }
      
      stopSpeaking();

      // Limpeza profunda de formatação para fala natural e fluida
      let clean = text
        .replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}]/gu, '') // Emojis
        .replace(/\*\*([^*]+)\*\*/g, '$1')                                         // Negrito **
        .replace(/\*([^*]+)\*/g, '$1')                                             // Itálico *
        .replace(/`([^`]+)`/g, '$1')                                               // Código `
        .replace(/#+\s+/g, '')                                                     // Títulos #
        .replace(/\[([^\]]+)\]\([^)]+\)/g, '$1')                                   // Links markdown
        .replace(/[-*•]\s+/g, '')                                                  // Bullets
        .replace(/\n+/g, ' ')                                                      // Quebras de linha
        .trim();

      if (!clean) return;

      const utter = new SpeechSynthesisUtterance(clean);
      utter.lang  = 'pt-BR';
      utter.rate  = 1.05; // Levemente dinâmico e agradável
      utter.pitch = 1.0;
      utter.volume = 1.0;
      if (ttsVoice) utter.voice = ttsVoice;

      utter.onstart = () => {
        setRobot('talking');
      };
      utter.onend = () => {
        setRobot('idle');
        currentUtterance = null;
      };
      utter.onerror = () => {
        setRobot('idle');
        currentUtterance = null;
      };

      currentUtterance = utter;
      synth.speak(utter);
    }

    // Botão de alternância da voz do robô
    const ttsToggle = document.createElement('button');
    ttsToggle.id = 'tts-toggle';
    ttsToggle.title = 'Silenciar/Ativar voz do BYTE';
    ttsToggle.innerHTML = `
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <path d="M9 5L5 8H2v4h3l4 3V5z"/>
        <path id="tts-wave1" d="M12 8.5a3 3 0 0 1 0 3"/>
        <path id="tts-wave2" d="M14 6.5a6 6 0 0 1 0 7"/>
      </svg>
      <span>Voz do BYTE ativa</span>`;
    ttsToggle.style.cssText = `
      display:flex;align-items:center;gap:0.4rem;
      background:rgba(37,99,235,0.12);border:1px solid rgba(37,99,235,0.35);
      border-radius:999px;padding:0.35rem 0.9rem 0.35rem 0.65rem;
      color:#60A5FA;font-size:0.75rem;font-weight:500;
      cursor:pointer;transition:all 0.2s;font-family:inherit;margin-top:0.25rem;
    `;
    ttsToggle.querySelector('svg').style.cssText = 'width:16px;height:16px;flex-shrink:0;';

    ttsToggle.addEventListener('click', () => {
      ttsEnabled = !ttsEnabled;
      if (!ttsEnabled) {
        stopSpeaking();
        ttsToggle.style.background = 'rgba(100,116,139,0.12)';
        ttsToggle.style.borderColor = 'rgba(100,116,139,0.3)';
        ttsToggle.style.color = '#64748B';
        ttsToggle.querySelector('span').textContent = 'Voz silenciada';
        const w1 = ttsToggle.querySelector('#tts-wave1');
        const w2 = ttsToggle.querySelector('#tts-wave2');
        if (w1) w1.style.opacity = '0.2';
        if (w2) w2.style.opacity = '0.2';
      } else {
        ttsToggle.style.background = 'rgba(37,99,235,0.12)';
        ttsToggle.style.borderColor = 'rgba(37,99,235,0.35)';
        ttsToggle.style.color = '#60A5FA';
        ttsToggle.querySelector('span').textContent = 'Voz do BYTE ativa';
        const w1 = ttsToggle.querySelector('#tts-wave1');
        const w2 = ttsToggle.querySelector('#tts-wave2');
        if (w1) w1.style.opacity = '1';
        if (w2) w2.style.opacity = '1';
      }
    });

    const micWrap = document.querySelector('.mic-cta-wrap');
    if (micWrap) micWrap.insertAdjacentElement('afterend', ttsToggle);

    /* ============================================================
       4. CHAT LOGIC (Anti-travamento com Timeout e Finally garantido)
    ============================================================ */
    const typingRow = document.getElementById('typing-indicator');
    const input     = document.getElementById('chat-input');
    const btnSend   = document.getElementById('btn-send');

    historyPanel.classList.add('open');

    let isProcessingMessage = false;

    function addMessage(role, text) {
      const msg = document.createElement('div');
      msg.className = `msg ${role}`;
      const av  = document.createElement('div');
      av.className = 'msg-av';
      av.textContent = role === 'bot' ? 'B' : 'U';
      const bub = document.createElement('div');
      bub.className = 'msg-bub';
      bub.textContent = text;
      msg.appendChild(av);
      msg.appendChild(bub);

      if (typingRow && typingRow.parentNode === historyBody) {
        historyBody.insertBefore(msg, typingRow);
      } else {
        historyBody.appendChild(msg);
      }

      requestAnimationFrame(() => {
        historyBody.scrollTop = historyBody.scrollHeight;
      });

      const store = JSON.parse(localStorage.getItem('byte_chat') || '[]');
      store.push({ role, text, ts: Date.now() });
      if (store.length > 20) store.splice(0, store.length - 20);
      localStorage.setItem('byte_chat', JSON.stringify(store));
    }

    function showTyping(show) {
      if (!typingRow) return;
      if (show) {
        typingRow.classList.add('active');
      } else {
        typingRow.classList.remove('active');
      }
      requestAnimationFrame(() => {
        historyBody.scrollTop = historyBody.scrollHeight;
      });
    }

    async function sendMessage(text) {
      const cleanText = text ? text.trim() : '';
      if (!cleanText) return;
      if (isProcessingMessage) return; // Bloqueia concorrência

      isProcessingMessage = true;
      stopSpeaking();

      // Trava visual de envio para evitar duplo clique
      btnSend.disabled = true;
      input.disabled = true;

      addMessage('user', cleanText);
      showTyping(true);
      setRobot('thinking');

      // AbortController com timeout estrito de 15 segundos no cliente
      const abortCtrl = new AbortController();
      const clientTimeout = setTimeout(() => abortCtrl.abort(), 15000);

      try {
        const res = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: cleanText }),
          signal: abortCtrl.signal
        });

        clearTimeout(clientTimeout);

        if (!res.ok) {
          throw new Error(`Servidor retornou status HTTP ${res.status}`);
        }

        const data = await res.json();
        const reply = data && data.reply ? data.reply : 'Recebi sua pergunta! Em que mais posso ajudar?';

        // Remove imediatamente as três bolinhas ANTES de renderizar e falar
        showTyping(false);
        addMessage('bot', reply);
        speak(reply);

      } catch (err) {
        clearTimeout(clientTimeout);
        console.error('[BYTE] Erro na requisição:', err);
        showTyping(false);

        let errorReply;
        if (err.name === 'AbortError') {
          errorReply = '⏱️ Ops, demorou um pouco para conectar com meus servidores. Já estou pronto de novo, pode perguntar!';
        } else {
          errorReply = '🤖 Tive uma pequena oscilação na rede, mas já me recuperei! Pode fazer sua pergunta novamente.';
        }

        addMessage('bot', errorReply);
        speak(errorReply);

      } finally {
        // GARANTIA ABSOLUTA: remove o indicador de carregamento e destrava a interface
        showTyping(false);
        isProcessingMessage = false;
        btnSend.disabled = false;
        input.disabled = false;
        input.focus();
        if (!currentUtterance && !byteSvg.classList.contains('state-listening')) {
          setRobot('idle');
        }
      }
    }

    btnSend.addEventListener('click', () => {
      const txt = input.value.trim();
      input.value = '';
      if (txt) sendMessage(txt);
    });

    input.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        const txt = input.value.trim();
        input.value = '';
        if (txt) sendMessage(txt);
      }
    });

    /* ============================================================
       5. RESTORE HISTORY from localStorage
    ============================================================ */
    const stored = JSON.parse(localStorage.getItem('byte_chat') || '[]');
    if (stored.length > 0) {
      stored.forEach(m => {
        const msg = document.createElement('div');
        msg.className = `msg ${m.role}`;
        const av  = document.createElement('div');
        av.className = 'msg-av';
        av.textContent = m.role === 'bot' ? 'B' : 'U';
        const bub = document.createElement('div');
        bub.className = 'msg-bub';
        bub.textContent = m.text;
        msg.appendChild(av);
        msg.appendChild(bub);
        historyBody.insertBefore(msg, typingRow);
      });
      historyBody.scrollTop = historyBody.scrollHeight;
    } else {
      setTimeout(() => {
        const welcome = 'Olá! Sou o BYTE, seu guia virtual na Feira Cultural de TI 👋 Pode me fazer perguntas por voz ou texto — estou aqui pra te ajudar!';
        addMessage('bot', welcome);
        speak(welcome);
      }, 700);
    }

    /* ============================================================
       6. TOPIC CHIPS
    ============================================================ */
    document.querySelectorAll('.chip[data-q]').forEach(chip => {
      chip.addEventListener('click', () => {
        sendMessage(chip.dataset.q);
      });
    });

    /* ============================================================
       7. RECONHECIMENTO DE VOZ (Sem repetições - Trava de Envio Único)
    ============================================================ */
    const btnMic   = document.getElementById('btn-mic');
    const micLabel = document.getElementById('mic-label');

    if ('SpeechRecognition' in window || 'webkitSpeechRecognition' in window) {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      const recognition = new SR();
      recognition.lang = 'pt-BR';
      recognition.interimResults = false; // Apenas resultados definitivos
      recognition.maxAlternatives = 1;
      recognition.continuous = false;     // Finaliza automaticamente ao parar de falar

      let isListening = false;
      let hasDispatchedThisSession = false; // Trava estrita contra disparos múltiplos
      let lastSentSpeech = '';
      let lastSpeechTimestamp = 0;

      btnMic.addEventListener('click', () => {
        if (isProcessingMessage) return; // Não inicia se já estiver respondendo
        
        if (isListening) {
          try { recognition.stop(); } catch (e) {}
        } else {
          stopSpeaking(); // Se o robô estiver falando, cala para ouvir o usuário
          hasDispatchedThisSession = false;
          try {
            recognition.start();
          } catch (e) {
            console.warn('[BYTE] Erro ao iniciar mic:', e);
          }
        }
      });

      recognition.addEventListener('start', () => {
        isListening = true;
        hasDispatchedThisSession = false;
        btnMic.classList.add('listening');
        micLabel.textContent = 'Ouvindo... fale agora';
        setRobot('listening');
      });

      recognition.addEventListener('result', e => {
        // Se já despachou nesta sessão ou já está processando, descarta eventos duplicados
        if (hasDispatchedThisSession || isProcessingMessage) return;

        let transcript = '';
        for (let i = e.resultIndex; i < e.results.length; i++) {
          if (e.results[i].isFinal) {
            transcript += e.results[i][0].transcript;
          }
        }

        // Fallback para quando o navegador não marca isFinal explicitamente
        if (!transcript && e.results.length > 0) {
          const lastRes = e.results[e.results.length - 1];
          if (lastRes && lastRes[0]) {
            transcript = lastRes[0].transcript;
          }
        }

        const cleanTranscript = transcript.trim();
        if (!cleanTranscript) return;

        // Debounce: previne envio da mesma frase dentro de 2.5 segundos
        const now = Date.now();
        if (cleanTranscript === lastSentSpeech && (now - lastSpeechTimestamp < 2500)) {
          return;
        }

        // MARCA COMO ENVIADO E INTERROMPE O MICROFONE IMEDIATAMENTE
        hasDispatchedThisSession = true;
        lastSentSpeech = cleanTranscript;
        lastSpeechTimestamp = now;

        try { recognition.stop(); } catch (err) {}

        // Envia exatamente UMA vez
        sendMessage(cleanTranscript);
      });

      recognition.addEventListener('end', () => {
        isListening = false;
        hasDispatchedThisSession = false;
        btnMic.classList.remove('listening');
        micLabel.textContent = 'Toque para falar';
        if (byteSvg.classList.contains('state-listening')) {
          setRobot('idle');
        }
      });

      recognition.addEventListener('error', e => {
        console.warn('[BYTE] Erro de reconhecimento:', e.error);
        isListening = false;
        hasDispatchedThisSession = false;
        btnMic.classList.remove('listening');
        micLabel.textContent = e.error === 'not-allowed' ? 'Permissão de mic negada' : 'Toque para falar';
        if (byteSvg.classList.contains('state-listening')) {
          setRobot('idle');
        }
      });

    } else {
      btnMic.disabled = true;
      btnMic.title = 'Microfone não suportado neste navegador';
      btnMic.style.opacity = '0.35';
      micLabel.textContent = 'Voz indisponível neste navegador';
    }

    /* ============================================================
       8. HEALTH CHECK
    ============================================================ */
    const dot  = document.getElementById('status-dot');
    const dtxt = document.getElementById('status-text');

    async function checkHealth() {
      try {
        const res  = await fetch('/health', { signal: AbortSignal.timeout(5000) });
        const data = await res.json();
        if (data.active === true) {
          dot.className = 'status-dot online';
          dtxt.textContent = 'Online';
        } else {
          dot.className = 'status-dot';
          dtxt.textContent = 'Manutenção';
        }
      } catch {
        dot.className = 'status-dot offline';
        dtxt.textContent = 'Offline';
      }
    }
    checkHealth();
    setInterval(checkHealth, 30000);

  })();
  </script>
</body>
</html>
